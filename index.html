            <button class="sm" onclick="window._setView('overview')">← Quay lại</button>
          </div>
          <div class="banner">
            <b>Mục tiêu phiên:</b> ${escHtml(gBudget.label)}<br/>
            <b>Chủ điểm trọng tâm:</b> ${escHtml(topics.join(' • ') || 'Ngữ pháp theo bậc')}
          </div>
          <h3 style="margin-top:12px;">📖 Quy tắc, ví dụ đúng & lưu ý bẫy (tổng hợp từ kho ngữ pháp phiên này):</h3>
          ${uniqueRules.slice(0, 8).map((r, i) => `
            <div class="item-card">
              <div><span class="tag">Điểm ${i + 1} • Bậc ${r.tier}</span> <b>${escHtml(r.topic)}</b></div>
              <div style="margin-top:6px;"><b>Ví dụ / Cấu trúc:</b> ${escHtml(r.sampleQ)} → <span style="color:var(--success);font-weight:700;">${escHtml(r.sampleAns)}</span></div>
              ${r.explanation ? `<div class="muted" style="margin-top:4px;"><b>Giải thích & bẫy:</b> ${escHtml(r.explanation)}</div>` : ''}
            </div>
          `).join('') || '<div class="banner warn">Các câu ngữ pháp trong kho chưa điền cột giải thích (explanation).</div>'}
          <button class="success" style="width:100%;margin-top:12px;" onclick="window._confirmGStage0()">✅ Đã hiểu lý thuyết — Quay lại để Luyện tập</button>
        </section>
      `;
    }

    if (a.view === 'ext_stage0') {
      const ext = STATE.vocab.find(v => v.vocab_id === snap.ext_id);
      return `
        <section class="card">
          <div class="between">
            <h2>Mảng 3 — Mục Mở rộng (${escHtml(ext?.tier_group)})</h2>
            <button class="sm" onclick="window._setView('overview')">← Quay lại</button>
          </div>
          <div class="item-card">
            <div class="between">
              <h3 style="margin:0;">${escHtml(ext?.lemma)}</h3>
              ${ext ? `<button class="sm" onclick="window._speakVocab('${ext.vocab_id}')">🔊 Nghe</button>` : ''}
            </div>
            <p style="margin:8px 0 4px;"><b>Nghĩa:</b> ${escHtml(ext?.meaning)}</p>
            <p class="muted" style="margin:0;"><b>Ví dụ:</b> ${escHtml(ext?.example || '—')} ${ext?.example_vi ? `<br/><i>${escHtml(ext.example_vi)}</i>` : ''}</p>
          </div>
          <button class="success" style="width:100%;margin-top:12px;" onclick="window._confirmExt()">✅ Xác nhận đã học mục mở rộng này</button>
        </section>
      `;
    }

    if (a.view === 'ch_ext') {
      const learnedExt = STATE.vocab.filter(v => v.status === 'PUBLISHED' && v.target_pool === 'EXTENSION_ONLY' && STATE.profile.ext_allocations[v.canonical_identity]);
      const allPubExt = STATE.vocab.filter(v => v.status === 'PUBLISHED' && v.target_pool === 'EXTENSION_ONLY');
      return `
        <section class="card">
          <div class="between"><h2>🧩 Luyện 4 Nhóm Mở rộng (Tự chọn)</h2><button class="sm" onclick="window._setView('overview')">← Quay lại</button></div>
          <p class="muted">Bài tập tương tác <b>5 câu/lượt</b> xoay vòng 3 dạng (Nhận diện nghĩa • Điền ngữ cảnh • Gõ cụm/viết tắt). Không cấp mục mới, không ảnh hưởng mở khóa phiên.</p>
          <div class="grid-2" style="margin:10px 0;">
            <div class="stat-box"><div class="stat-num">${learnedExt.length}</div><div class="stat-lbl">Mục mở rộng đã học</div></div>
            <div class="stat-box"><div class="stat-num">${allPubExt.length}</div><div class="stat-lbl">Tổng mục PUBLISHED trong kho</div></div>
          </div>
          <div class="row">
            <button class="primary" style="flex:1;" ${learnedExt.length ? '' : 'disabled'} onclick="window._startExtQuiz('learned')">▶ Luyện 5 câu (Từ mục đã học)</button>
            <button class="success" style="flex:1;" ${allPubExt.length ? '' : 'disabled'} onclick="window._startExtQuiz('all_pub')">▶ Luyện 5 câu (Toàn bộ kho PUBLISHED)</button>
          </div>
        </section>
      `;
    }

    if (a.view === 'ch_speed') {
      if (!a.speed) {
        return `
          <section class="card">
            <div class="between"><h2>⚡ Speed Round — Phản xạ nhanh</h2><button class="sm" onclick="window._setView('overview')">← Quay lại</button></div>
            <p class="muted">Luyện tốc độ nhận diện từ & nghĩa của phiên hiện tại. Hết giờ không mất Streak, không cộng XP vô hạn.</p>
            <div class="grid-2" style="margin-top:10px;">
              <button class="primary" onclick="window._startSpeedRound(30)">⚡ 30 giây</button>
              <button class="primary" onclick="window._startSpeedRound(60)">⚡ 60 giây</button>
              <button class="primary" onclick="window._startSpeedRound(90)">⚡ 90 giây</button>
              <button onclick="window._startSpeedRound(0)">♾️ Không giới hạn</button>
            </div>
          </section>
        `;
      }
      const sp = a.speed;
      if (sp.finished) {
        return `
          <section class="card">
            <h2>🏁 Kết quả Speed Round</h2>
            <div class="grid-2" style="margin:10px 0;">
              <div class="stat-box"><div class="stat-num">${sp.score}</div><div class="stat-lbl">Câu trả lời đúng</div></div>
              <div class="stat-box"><div class="stat-num">${sp.total}</div><div class="stat-lbl">Tổng số lượt phản xạ</div></div>
            </div>
            <div class="row">
              <button class="primary" onclick="window._resetSpeedRound()">🔄 Chơi lượt mới</button>
              <button onclick="window._setView('overview')">← Về phiên học</button>
            </div>
          </section>
        `;
      }
      const curQ = sp.current;
      return `
        <section class="card">
          <div class="between">
            <h3>⚡ Speed Round • Đúng: ${sp.score}/${sp.total}</h3>
            <span class="pill ${sp.limit > 0 && sp.left <= 10 ? 'err' : 'pri'}" id="speedClock">${sp.limit > 0 ? `⏱️ ${sp.left}s` : '♾️ Tự do'}</span>
          </div>
          <p style="font-size:18px;font-weight:800;margin:10px 0;">${escHtml(curQ.prompt)}</p>
          ${curQ.options.map((o, idx) => `<button class="opt-btn" onclick="window._answerSpeed(${idx})">${escHtml(o)}</button>`).join('')}
          <button class="sm" style="margin-top:12px;" onclick="window._stopSpeedRound()">⏹️ Dừng lượt</button>
        </section>
      `;
    }

    if (a.view === 'quiz' && a.quiz) {
      const qz = a.quiz;
      const q = qz.questions[qz.idx];
      return `
        <section class="card">
          <div class="between">
            <h3>${escHtml(qz.title)} (${qz.idx + 1}/${qz.questions.length})</h3>
            <button class="sm" onclick="window._pauseQuiz()">⏸️ Tạm dừng</button>
          </div>
          <div class="row" style="margin-bottom:8px;">
            <span class="tag">${escHtml(q.skill)}</span>
            <span class="tag">${escHtml(q.activity_label || '')}</span>
          </div>
          <p style="white-space:pre-wrap;font-weight:700;margin:8px 0;">${escHtml(q.prompt)}</p>
          ${q.speakText ? `<button class="sm primary" style="margin-bottom:10px;" onclick="window._speakQuizCurrent()">🔊 Nghe phát âm</button>` : ''}

          ${q.engine === 'mcq' ? `
            ${q.options.map((opt, i) => `<button class="opt-btn" onclick="window._answerQuizOpt(${i})">${escHtml(opt)}</button>`).join('')}
          ` : ''}

          ${q.engine === 'match' ? `
            ${q.pairs.map((p, idx) => `
              <div class="item-card">
                <div><b>${idx + 1}. ${escHtml(p.left)}</b></div>
                <select id="matchSel_${idx}" style="margin-top:6px;">
                  <option value="">-- Chọn nghĩa tiếng Việt tương ứng --</option>
                  ${q.rightOptions.map(ro => `<option value="${ro.key}">${escHtml(ro.text)}</option>`).join('')}
                </select>
              </div>
            `).join('')}
            <button class="primary" style="width:100%;margin-top:10px;" onclick="window._submitMatch()">Xác nhận nối 4 cặp</button>
          ` : ''}

          ${q.engine === 'text' ? `
            <input id="quizTextInput" placeholder="Nhập đáp án tiếng Anh..." autocomplete="off" />
            <button class="primary" style="width:100%;margin-top:10px;" onclick="window._answerQuizText()">Xác nhận đáp án</button>
          ` : ''}

          ${q.engine === 'sentence' ? `
            <textarea id="quizSentInput" placeholder="Viết câu tiếng Anh có chứa từ '${escHtml(q.targetWord)}' (tối thiểu 4 từ)..."></textarea>
            <button class="primary" style="width:100%;margin-top:10px;" onclick="window._answerQuizSentence()">Nộp câu & Lưu vào My Sentence Bank</button>
          ` : ''}

          ${q.engine === 'scramble' ? `
            <div class="item-card" id="scramblePreview" style="min-height:46px;font-weight:700;">${escHtml((qz.scramblePicked || []).map(i => q.tokens[i]).join(' ') || '(Chạm các từ bên dưới theo đúng thứ tự)')}</div>
            <div class="chip-wrap">
              ${q.tokens.map((tok, i) => {
                const used = (qz.scramblePicked || []).includes(i);
                return `<button class="word-chip" ${used ? 'disabled' : ''} onclick="window._pickScramble(${i})">${escHtml(tok)}</button>`;
              }).join('')}
            </div>
            <div class="row" style="margin-top:10px;">
              <button class="sm" onclick="window._clearScramble()">↩️ Xếp lại</button>
              <button class="primary" style="flex:1;" onclick="window._submitScramble()">Xác nhận câu đã xếp</button>
            </div>
          ` : ''}

          ${q.engine === 'speak' ? `
            <div class="banner">🎙️ Thử đọc bằng micro hoặc chọn <b>SPEAKING_FALLBACK</b> nếu đang ở nơi ồn / không có micro (ghi nhận là hoạt động thay thế).</div>
            <div class="row" style="margin-top:10px;">
              <button class="primary" style="flex:1;" onclick="window._tryMicSpeak()">🎙️ Bấm nói bằng Micro</button>
              <button class="success" style="flex:1;" onclick="window._answerSpeakFallback()">✅ SPEAKING_FALLBACK (Đã tự luyện mẫu)</button>
            </div>
          ` : ''}
        </section>
      `;
    }
    return '';
  }

  function renderContentTab() {
    const coreVocab = STATE.vocab.filter(v => v.target_pool === 'SESSION_POOL');
    const extVocab = STATE.vocab.filter(v => v.target_pool === 'EXTENSION_ONLY');
    const gramAll = STATE.grammar;

    const countPub = (arr, fn = () => true) => arr.filter(x => x.status === 'PUBLISHED' && fn(x)).length;
    const countDraft = (arr) => arr.filter(x => x.status === 'DRAFT').length;
    const totalDraft = countDraft(coreVocab) + countDraft(extVocab) + countDraft(gramAll);
    const extBreakdown = EXT_ROTATION.map(g => `${g.replace('EXT_', '')}: ${countPub(extVocab, v => v.tier_group === g)}/25`).join(' • ');

    let listHtml = '';
    const f = STATE.contentFilter;
    const qLower = (f.q || '').toLowerCase();

    if (STATE.contentSubTab === 'vocab') {
      const items = coreVocab.filter(v =>
        (f.status === 'ALL' || v.status === f.status) &&
        (f.group === 'ALL' || v.tier_group === f.group) &&
        (!qLower || `${v.lemma} ${v.meaning} ${v.categories}`.toLowerCase().includes(qLower))
      );
      listHtml = `
        <div class="grid-3" style="margin-bottom:8px;">
          <select onchange="window._setFilter('status', this.value)">
            ${['ALL', 'PUBLISHED', 'DRAFT', 'ARCHIVED'].map(s => `<option value="${s}" ${f.status===s?'selected':''}>${s === 'ALL' ? 'Mọi trạng thái' : s}</option>`).join('')}
          </select>
          <select onchange="window._setFilter('group', this.value)">
            ${['ALL', 'BASIC', 'SPECIALIZED', 'IELTS_ADV'].map(g => `<option value="${g}" ${f.group===g?'selected':''}>${g === 'ALL' ? 'Mọi tầng từ' : g}</option>`).join('')}
          </select>
          <input placeholder="Tìm từ / nghĩa..." value="${escHtml(f.q)}" oninput="window._setFilter('q', this.value)" />
        </div>
        <p class="muted">Đang hiển thị ${Math.min(items.length, 60)}/${items.length} từ chính khóa (hỗ trợ nhập không giới hạn, mức sàn 1.200 từ).</p>
        ${items.slice(0, 60).map(v => `
          <div class="item-card between">
            <div>
              <b>${escHtml(v.lemma)}</b> <span class="tag">${escHtml(v.tier_group)}</span> <span class="tag">${escHtml(v.status)} v${v.version}</span>
              <div class="muted">${escHtml(v.meaning)} ${v.ipa ? `• ${escHtml(v.ipa)}` : ''}</div>
            </div>
            <button class="sm" onclick="window._editVocabModal('${v.vocab_id}')">✏️ Sửa</button>
          </div>
        `).join('') || '<p class="muted">Chưa có từ vựng chính khóa khớp bộ lọc.</p>'}
      `;
    } else if (STATE.contentSubTab === 'grammar') {
      const items = gramAll.filter(g =>
        (f.status === 'ALL' || g.status === f.status) &&
        (f.group === 'ALL' || String(g.tier) === f.group) &&
        (!qLower || `${g.topic} ${g.question} ${g.explanation}`.toLowerCase().includes(qLower))
      );
      listHtml = `
        <div class="grid-3" style="margin-bottom:8px;">
          <select onchange="window._setFilter('status', this.value)">
            ${['ALL', 'PUBLISHED', 'DRAFT', 'ARCHIVED'].map(s => `<option value="${s}" ${f.status===s?'selected':''}>${s === 'ALL' ? 'Mọi trạng thái' : s}</option>`).join('')}
          </select>
          <select onchange="window._setFilter('group', this.value)">
            <option value="ALL">Mọi bậc (1–6)</option>
            ${[1,2,3,4,5,6].map(t => `<option value="${t}" ${f.group===String(t)?'selected':''}>Bậc ${t}</option>`).join('')}
          </select>
          <input placeholder="Tìm chủ điểm / câu hỏi..." value="${escHtml(f.q)}" oninput="window._setFilter('q', this.value)" />
        </div>
        <p class="muted">Đang hiển thị ${Math.min(items.length, 60)}/${items.length} câu ngữ pháp.</p>
        ${items.slice(0, 60).map(g => `
          <div class="item-card">
            <div class="between">
              <div><span class="tag">Bậc ${g.tier}</span> <span class="tag">${escHtml(g.status)} v${g.version}</span> <b>${escHtml(g.topic)}</b></div>
              <button class="sm" onclick="window._editGrammarModal('${g.grammar_id}')">✏️ Sửa</button>
            </div>
            <div style="margin-top:6px;">${escHtml(g.question)}</div>
            <div class="muted"><b>Đáp án đúng:</b> ${escHtml(g.options[g.answer_index] || '')} ${g.explanation ? `• <i>${escHtml(g.explanation)}</i>` : ''}</div>
          </div>
        `).join('') || '<p class="muted">Chưa có câu ngữ pháp nào trong kho.</p>'}
      `;
    } else {
      const items = extVocab.filter(v =>
        (f.status === 'ALL' || v.status === f.status) &&
        (f.group === 'ALL' || v.tier_group === f.group) &&
        (!qLower || `${v.lemma} ${v.meaning}`.toLowerCase().includes(qLower))
      );
      listHtml = `
        <div class="grid-3" style="margin-bottom:8px;">
          <select onchange="window._setFilter('status', this.value)">
            ${['ALL', 'PUBLISHED', 'DRAFT', 'ARCHIVED'].map(s => `<option value="${s}" ${f.status===s?'selected':''}>${s === 'ALL' ? 'Mọi trạng thái' : s}</option>`).join('')}
          </select>
          <select onchange="window._setFilter('group', this.value)">
            <option value="ALL">Cả 4 nhóm</option>
            ${EXT_ROTATION.map(g => `<option value="${g}" ${f.group===g?'selected':''}>${g}</option>`).join('')}
          </select>
          <input placeholder="Tìm thành ngữ / viết tắt..." value="${escHtml(f.q)}" oninput="window._setFilter('q', this.value)" />
        </div>
        <p class="muted">Chi tiết PUBLISHED: <b>${extBreakdown}</b></p>
        ${items.slice(0, 60).map(v => `
          <div class="item-card between">
            <div>
              <b>${escHtml(v.lemma)}</b> <span class="tag">${escHtml(v.tier_group)}</span> <span class="tag">${escHtml(v.status)} v${v.version}</span>
              <div class="muted">${escHtml(v.meaning)}</div>
            </div>
            <button class="sm" onclick="window._editVocabModal('${v.vocab_id}')">✏️ Sửa</button>
          </div>
        `).join('') || '<p class="muted">Chưa có mục mở rộng nào trong kho.</p>'}
      `;
    }

    return `
      <section class="card">
        <h2>Content Health Dashboard (Định mức tối thiểu — Nhập dư không giới hạn)</h2>
        <div class="grid-3" style="margin-top:8px;">
          <div class="stat-box"><div class="stat-num">${countPub(coreVocab)}<span style="font-size:12px;">/1200+</span></div><div class="stat-lbl">Từ chính khóa PUB (Nháp: ${countDraft(coreVocab)})</div></div>
          <div class="stat-box"><div class="stat-num">${countPub(gramAll)}</div><div class="stat-lbl">Ngữ pháp PUB (Nháp: ${countDraft(gramAll)})</div></div>
          <div class="stat-box"><div class="stat-num">${countPub(extVocab)}<span style="font-size:12px;">/100+</span></div><div class="stat-lbl">4 Mở rộng PUB (Nháp: ${countDraft(extVocab)})</div></div>
        </div>
        <div class="muted" style="margin-top:8px;">
          <b>Từ chính khóa PUB:</b> BASIC ${countPub(coreVocab, v => v.tier_group==='BASIC')}/500 • SPEC ${countPub(coreVocab, v => v.tier_group==='SPECIALIZED')}/425 • ADV ${countPub(coreVocab, v => v.tier_group==='IELTS_ADV')}/275<br/>
          <b>4 Mở rộng PUB:</b> ${extBreakdown}
        </div>
        ${totalDraft > 0 ? `<div class="banner warn">⚠️ Đang có <b>${totalDraft} mục DRAFT</b> chưa phát hành. Cần bấm duyệt PUBLISHED thì phiên học mới đọc được!</div>` : ''}
        <div class="row" style="margin-top:10px;">
          <button class="success sm" ${totalDraft ? '' : 'disabled'} onclick="window._publishAllDrafts()">✅ Duyệt & Phát hành toàn bộ DRAFT (${totalDraft})</button>
          <button class="danger sm" ${totalDraft ? '' : 'disabled'} onclick="window._cleanUnusedDrafts()">🗑️ Xóa sạch DRAFT chưa dùng</button>
        </div>
      </section>

      <section class="card">
        <h2>Nạp tệp # MASTER365_TXT_SCHEMA=2 (Import Preview & Xác minh sau ghi)</h2>
        <input type="file" id="txtFileInput" accept=".txt" onchange="window._handleTxtFile(event)" />
        <textarea id="txtPasteInput" style="margin-top:8px;" placeholder="Hoặc dán trực tiếp nội dung # MASTER365_TXT_SCHEMA=2 vào đây..."></textarea>
        <div class="row" style="margin-top:8px;">
          <button class="primary" onclick="window._previewImport()">🔍 1. Quét & Xem trước (Import Preview)</button>
        </div>
        ${STATE.importPreview ? `
          <div class="item-card">
            <b>📊 Kết quả quét:</b> ${STATE.importPreview.summary.core_vocab} Từ chính khóa • <b>${STATE.importPreview.summary.grammar} Ngữ pháp</b> • <b>${STATE.importPreview.summary.ext_vocab} Mở rộng</b> • <b style="color:var(--danger);">${STATE.importPreview.errors.length} lỗi</b>.
            ${STATE.importPreview.summary.near_conflicts > 0 ? `
              <div class="banner warn">
                Phát hiện ${STATE.importPreview.summary.near_conflicts} câu ngữ pháp gần trùng câu cũ. Chọn cách xử lý ID bất biến:
                <select style="margin-top:6px;" onchange="window._setNearConflictMode(this.value)">
                  <option value="update_old">Cập nhật ID cũ (tăng version, giữ lịch sử)</option>
                  <option value="create_new">Tạo ID mới hoàn toàn</option>
                </select>
              </div>
            ` : ''}
            ${STATE.importPreview.errors.length ? `<pre style="max-height:130px;overflow:auto;font-size:12px;color:var(--danger);">${escHtml(STATE.importPreview.errors.slice(0, 20).join('\n'))}</pre>` : ''}
            <button class="success" style="width:100%;margin-top:8px;" onclick="window._commitImport()">💾 2. Xác nhận ghi an toàn vào IndexedDB (DRAFT)</button>
          </div>
        ` : ''}
      </section>

      <section class="card">
        <h2>Quản lý & Chỉnh sửa tay (3 Kho tách bạch)</h2>
        <div class="subtabs">
          <button class="subtab ${STATE.contentSubTab==='vocab'?'active':''}" onclick="window._setContentSubTab('vocab')">Từ vựng (${coreVocab.length})</button>
          <button class="subtab ${STATE.contentSubTab==='grammar'?'active':''}" onclick="window._setContentSubTab('grammar')">Ngữ pháp (${gramAll.length})</button>
          <button class="subtab ${STATE.contentSubTab==='ext'?'active':''}" onclick="window._setContentSubTab('ext')">4 Mở rộng (${extVocab.length})</button>
        </div>
        ${listHtml}
      </section>
    `;
  }

  function renderRoadmapTab() {
    const cur = STATE.profile.current_session_id;
    const rf = STATE.roadmapFilter;
    let list = SESSION_MAP;
    if (rf.startsWith('MONTH_')) {
      const m = parseInt(rf.split('_')[1], 10);
      list = SESSION_MAP.filter(s => s.month_index === m);
    } else if (rf === 'FINAL') {
      list = SESSION_MAP.filter(s => s.month_index === 13);
    }

    return `
      <section class="card">
        <div class="between">
          <h2>Bản đồ cố định 365 Phiên</h2>

  function recordSkill(skill, ok, topic = null) {
    const key = STATE.profile.skill_stats[skill] ? skill : 'Reading';
    if (ok) STATE.profile.skill_stats[key].ok++;
    else STATE.profile.skill_stats[key].err++;
    if (topic) {
      if (!STATE.profile.grammar_mastery[topic]) STATE.profile.grammar_mastery[topic] = { ok: 0, err: 0 };
      if (ok) STATE.profile.grammar_mastery[topic].ok++;
      else STATE.profile.grammar_mastery[topic].err++;
    }
  }

  function finishQuiz() {
    const a = STATE.activeSession;
    const qz = a.quiz;
    const snap = STATE.profile.snapshots[a.session_id];
    const total = qz.initialCount;
    const score = qz.correct;

    if (qz.mode === 'v_prac') {
      if (!qz.freePick && a.tracks.vocab !== 'COMPLETED') a.tracks.vocab = 'READY_FOR_ASSESSMENT';
      toast(qz.freePick ? `🎯 Xong lượt luyện dạng ${qz.title}: ${score}/${total} đúng!` : '✅ Hoàn tất Luyện Từ vựng 4 kỹ năng! Bạn có thể vào Đánh giá Từ vựng.');
    } else if (qz.mode === 'v_assess') {
      const minNeed = ceilScore(total, 80);
      const allWords1Ok = snap.vocab_ids.every(vid => (qz.perVocabOk[vid] || 0) >= 1);
      const passed = score >= minNeed && allWords1Ok;
      a.attempts.vocab.push({ score, total, passed, at: new Date().toISOString() });
      if (passed) {
        a.tracks.vocab = 'COMPLETED';
        toast(`🎉 Đạt Đánh giá Từ vựng (${score}/${total})!`);
      } else {
        if (a.tracks.vocab !== 'COMPLETED') a.tracks.vocab = 'ASSESSMENT_FAILED';
        toast(`⚠️ Chưa đạt (${score}/${total} — cần ≥${minNeed} & mỗi từ ≥1 câu đúng). Hãy thi lại lượt mới!`);
      }
    } else if (qz.mode === 'g_prac') {
      if (a.tracks.grammar !== 'COMPLETED') a.tracks.grammar = 'READY_FOR_ASSESSMENT';
      toast('✅ Hoàn tất Luyện Ngữ pháp! Bạn có thể vào Đánh giá Ngữ pháp.');
    } else if (qz.mode === 'g_assess') {
      const minNeed = ceilScore(total, 75);
      const passed = score >= minNeed;
      a.attempts.grammar.push({ score, total, passed, at: new Date().toISOString() });
      if (passed) {
        a.tracks.grammar = 'COMPLETED';
        toast(`🎉 Đạt Đánh giá Ngữ pháp (${score}/${total})!`);
      } else {
        if (a.tracks.grammar !== 'COMPLETED') a.tracks.grammar = 'ASSESSMENT_FAILED';
        toast(`⚠️ Chưa đạt Ngữ pháp (${score}/${total}, cần ≥${minNeed}). Bấm Đánh giá lại để làm đề thi lại!`);
      }
    } else if (qz.mode === 'ext_prac') {
      toast(`🧩 Hoàn thành lượt Luyện Mở rộng: ${score}/${total} câu đúng!`);
    } else if (qz.mode === 'exam') {
      const minTotal = ceilScore(total, snap.meta.pass_pct || 80);
      const d = qz.domainScores;
      const vFloor = d.vocab.tot ? ceilScore(d.vocab.tot, 70) : 0;
      const gFloor = d.grammar.tot ? ceilScore(d.grammar.tot, 70) : 0;
      const passed = (score >= minTotal) && (d.vocab.ok >= vFloor) && (d.grammar.ok >= gFloor);
      a.attempts.exam.push({ score, total, d, passed, at: new Date().toISOString() });
      if (passed) {
        a.tracks.exam = 'COMPLETED';
        toast(`🎉 Đậu ${snap.meta.session_type}! (${score}/${total} | TV: ${d.vocab.ok}/${d.vocab.tot} | NP: ${d.grammar.ok}/${d.grammar.tot})`);
      } else {
        if (a.tracks.exam !== 'COMPLETED') a.tracks.exam = 'ASSESSMENT_FAILED';
        toast(`⚠️ Chưa đạt! Tổng ${score}/${total} (cần ≥${minTotal}), TV ${d.vocab.ok}/${d.vocab.tot} (≥${vFloor}), NP ${d.grammar.ok}/${d.grammar.tot} (≥${gFloor}).`);
      }
    }
    a.quiz = null;
    a.view = (qz.mode === 'ext_prac') ? 'ch_ext' : 'overview';
    checkSessionCompletion();
    saveProfile(); saveActiveSession(); render();
  }

  function advanceQuiz(isOk, userAns, q) {
    const a = STATE.activeSession, qz = a.quiz;
    const isInitialPass = qz.idx < qz.initialCount;
    recordSkill(q.skill, isOk, q.topic || null);

    if (isOk) {
      if (isInitialPass) {
        qz.correct++;
        if (q.vocab_id) qz.perVocabOk[q.vocab_id] = (qz.perVocabOk[q.vocab_id] || 0) + 1;
        if (q.primary_domain && qz.domainScores[q.primary_domain]) qz.domainScores[q.primary_domain].ok++;
      }
      toast(q.explanation ? `✅ Đúng! ${q.explanation}` : '✅ Chính xác!');
    } else {
      STATE.profile.mistakes.push({
        id: makeImmutableId('err'), type: q.skill, ref_id: q.vocab_id || q.grammar_id,
        prompt: q.prompt.slice(0, 120), wrong: userAns || '(Bỏ trống)', correct: q.answer, date: getLogicalDay()
      });
      if (qz.isPractice) {
        qz.questions.push({ ...q });
      }
      toast(`❌ Chưa đúng! Đáp án: ${q.answer}`);
    }
    qz.scramblePicked = [];
    qz.idx++;
    if (qz.idx >= qz.questions.length) {
      finishQuiz();
    } else {
      saveProfile(); saveActiveSession(); render();
    }
  }

  };
  window._speakSessionChain = () => {
    const snap = STATE.profile.snapshots[STATE.activeSession.session_id];
    const txt = snap.vocab_ids.map(id => STATE.vocab.find(v => v.vocab_id === id)).filter(Boolean).map(v => `${v.lemma}. ${v.example || ''}`).join(' ... ');

  };
  window._speakMiniDialogue = () => {
    const snap = STATE.profile.snapshots[STATE.activeSession.session_id];
    const txt = snap.vocab_ids.map(id => STATE.vocab.find(v => v.vocab_id === id)).filter(Boolean).map(v => v.example || `Let's use ${v.lemma}.`).join(' ... ');
    speakText(txt, STATE.activeSession.audio_rate || 1.0);
  };
  window._speakQuizCurrent = () => {
    const q = STATE.activeSession?.quiz?.questions?.[STATE.activeSession.quiz.idx];

    STATE.activeSession.view = 'overview';

    STATE.activeSession.view = 'overview';
    checkSessionCompletion(); saveActiveSession(); render();
    toast('✅ Đã xác nhận hoàn thành mục Mở rộng.');
  };

  // Mở bộ chọn 1 trong 48 dạng bài (40 hoạt động + 8 INTEGRATED)
  window._openActivityPicker = () => {
    const groups = [
      ['Listening (1–10)', 'Listening'],
      ['Reading (11–20)', 'Reading'],
      ['Speaking (21–30)', 'Speaking'],
      ['Writing (31–40)', 'Writing'],
      ['INTEGRATED (41–48)', 'Integrated']
    ];
    openModal(`
      <h3>🎯 Tự chọn luyện riêng 1 trong 48 dạng bài</h3>
      <p class="muted">Luyện tự do theo từ vựng phiên hiện tại (không tính trượt phiên, không cộng trùng XP).</p>
      ${groups.map(([title, key]) => `
        <div class="item-card">
          <b>${title}</b>
          <div class="row" style="margin-top:6px;">
            ${ACTIVITY_40[key].map(act => `<button class="sm" onclick="window._closeModal();window._startSpecificActivity('${key}', ${act.id})">#${act.id} ${escHtml(act.name)}</button>`).join('')}
          </div>
        </div>
      `).join('')}
      <button style="width:100%;margin-top:10px;" onclick="window._closeModal()">Đóng</button>
    `);
  };

  window._startSpecificActivity = (groupKey, actId) => {
    const act = (ACTIVITY_40[groupKey] || []).find(x => x.id === actId);
    if (!act) return;
    const a = STATE.activeSession;
    const snap = STATE.profile.snapshots[a.session_id];
    const qs = buildVocabPractice(snap.vocab_ids, a.session_id, act);
    if (!qs.length) return;
    a.quiz = {
      mode: 'v_prac', freePick: true, title: `Tự luyện #${act.id} ${act.name}`,
      isPractice: false, questions: qs, initialCount: qs.length, idx: 0, correct: 0,
      perVocabOk: {}, domainScores: { vocab: { ok: 0, tot: qs.length }, grammar: { ok: 0, tot: 0 } },
      scramblePicked: []
    };
    a.view = 'quiz';
    saveActiveSession(); render();
  };

  window._startQuiz = (mode) => {
    const a = STATE.activeSession;
    const snap = STATE.profile.snapshots[a.session_id];
    if (a.quiz && a.quiz.mode === mode && a.quiz.idx < a.quiz.questions.length) {
      a.view = 'quiz'; render(); return;
    }
    let questions = [], title = '', isPractice = false;
    if (mode === 'v_prac') {
      questions = buildVocabPractice(snap.vocab_ids, a.session_id, null);
      title = 'Luyện Từ vựng (40 dạng + 8 INTEGRATED)'; isPractice = true;
    } else if (mode === 'v_assess') {
      questions = buildVocabAssessment(snap.vocab_ids, (a.attempts.vocab || []).length);
      title = 'Đánh giá Từ vựng độc lập'; isPractice = false;
    } else if (mode === 'g_prac') {
      questions = buildGrammarExercises(snap.grammar_prac_ids, false);
      title = 'Luyện Ngữ pháp (Reading & Writing)'; isPractice = true;
    } else if (mode === 'g_assess') {
      const isRetake = (a.attempts.grammar || []).length > 0 && snap.grammar_retake_ids?.length;
      const ids = isRetake ? snap.grammar_retake_ids : snap.grammar_assess_ids;
      questions = buildGrammarExercises(ids, true);
      title = isRetake ? 'Đánh giá Ngữ pháp (Đề thi lại)' : 'Đánh giá Ngữ pháp độc lập';
      isPractice = false;
    } else if (mode === 'exam') {
      questions = buildExamQuestions(snap);
      title = `Kỳ thi ${snap.meta.session_type}`; isPractice = false;
    }
    if (!questions.length) { toast('Không có câu hỏi hợp lệ để bắt đầu.'); return; }

    const domainScores = { vocab: { ok: 0, tot: 0 }, grammar: { ok: 0, tot: 0 }, listening: { ok: 0, tot: 0 }, reading: { ok: 0, tot: 0 }, writing: { ok: 0, tot: 0 }, speaking: { ok: 0, tot: 0 }, ext: { ok: 0, tot: 0 } };
    questions.forEach(q => { if (q.primary_domain && domainScores[q.primary_domain]) domainScores[q.primary_domain].tot++; });

    a.quiz = { mode, freePick: false, title, isPractice, questions, initialCount: questions.length, idx: 0, correct: 0, perVocabOk: {}, domainScores, scramblePicked: [] };
    a.view = 'quiz';
    saveActiveSession(); render();
  };

  window._startExtQuiz = (sourceMode) => {

  window._answerQuizOpt = (i) => {
    const q = STATE.activeSession.quiz.questions[STATE.activeSession.quiz.idx];

    advanceQuiz(normalizeAns(picked) === normalizeAns(q.answer), picked, q);
  };
  window._submitMatch = () => {
    const q = STATE.activeSession.quiz.questions[STATE.activeSession.quiz.idx];
    let allRight = true;
    const summary = [];
    for (let i = 0; i < q.pairs.length; i++) {
      const sel = document.getElementById(`matchSel_${i}`)?.value;
      if (sel === '' || Number(sel) !== q.pairs[i].key) allRight = false;
      const chosenTxt = q.rightOptions.find(r => String(r.key) === String(sel))?.text || '(Chưa chọn)';
      summary.push(`${q.pairs[i].left}→${chosenTxt}`);
    }
    const rightAnsText = q.pairs.map(p => `${p.left}: ${p.right}`).join(' | ');
    advanceQuiz(allRight, summary.join(', '), { ...q, answer: rightAnsText });
  };
  window._answerQuizText = () => {
    const q = STATE.activeSession.quiz.questions[STATE.activeSession.quiz.idx];
    const val = document.getElementById('quizTextInput')?.value || '';
    advanceQuiz(normalizeAns(val) === normalizeAns(q.answer), val, q);
  };

    const q = STATE.activeSession.quiz.questions[STATE.activeSession.quiz.idx];
    const val = (document.getElementById('quizSentInput')?.value || '').trim();
    const words = val.split(/\s+/).filter(Boolean);
    const hasWord = val.toLowerCase().includes((q.targetWord || '').toLowerCase());
    if (words.length >= 4 && hasWord) {
      STATE.profile.sentence_bank.push({ id: makeImmutableId('sent'), vocab_id: q.vocab_id, lemma: q.targetWord, sentence: val, date: getLogicalDay() });
      advanceQuiz(true, val, q);

  function nextSpeedQuestion() {
    const snap = STATE.profile.snapshots[STATE.activeSession.session_id];
    const allPub = STATE.vocab.filter(v => v.status === 'PUBLISHED' && v.target_pool === 'SESSION_POOL');
    const pool = (snap.vocab_ids || []).map(id => STATE.vocab.find(v => v.vocab_id === id)).filter(Boolean);
    const usePool = pool.length ? pool : allPub;
    const v = usePool[Math.floor(Math.random() * usePool.length)];
    const others = shuffle(allPub.filter(x => x.vocab_id !== v.vocab_id)).slice(0, 3);
    return { prompt: `${v.lemma} (${v.pos})`, options: shuffle([v.meaning, ...others.map(x => x.meaning)]), answer: v.meaning };
  }
  window._startSpeedRound = (sec) => {
    if (STATE.speedTimer) clearInterval(STATE.speedTimer);
    STATE.activeSession.speed = { limit: sec, left: sec, score: 0, total: 0, finished: false, current: nextSpeedQuestion() };
    if (sec > 0) {
      STATE.speedTimer = setInterval(() => {
        const sp = STATE.activeSession?.speed;
        if (!sp || sp.finished) { clearInterval(STATE.speedTimer); return; }
        sp.left--;
        const clk = document.getElementById('speedClock');
        if (clk) clk.textContent = `⏱️ ${sp.left}s`;
        if (sp.left <= 0) {
          clearInterval(STATE.speedTimer); sp.finished = true; render();
        }

    }
    render();
  };

  window._rateSrs = async (vid, ok) => {
    const intervals = [1, 3, 7, 14, 30];
    const s = STATE.profile.srs[vid];

    else { s.interval_idx = 0; s.lapses++; }
    s.due_day = addDays(getLogicalDay(), intervals[s.interval_idx]);

    const v = await applyFullPayload(b.payload, `Backup ${b.logical_day}`);
    render();
    toast(`↩️ Đã khôi phục xong: ${v.coreVocab} Từ • ${v.grammar} Ngữ pháp • ${v.extVocab} Mở rộng.`);
  };
  window._exportJson = () => {
    const payload = buildFullPayload('manual_json_export');
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `master365-backup-${getLogicalDay()}.json`;
    a.click();
    toast('⬇️ Đã xuất file Backup JSON.');
  };
  window._importJson = (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = async () => {
      try {
        const data = JSON.parse(r.result);
        const v = await applyFullPayload(data, 'File JSON');
        render();
        toast(`✅ Đã nhập JSON & xác minh DB: ${v.coreVocab} Từ • ${v.grammar} Ngữ pháp • ${v.extVocab} Mở rộng.`);
      } catch (err) { toast(`❌ Tệp JSON không hợp lệ: ${err.message}`); }
    };
    r.readAsText(f, 'utf-8');
  };

  window._saveReminder = async () => {
    STATE.profile.evening_reminder = document.getElementById('inpReminder')?.value || '20:30';
    await saveProfile(); toast('✅ Đã lưu giờ nhắc học buổi tối.');
  };
  window._resetTestProfileModal = () => {
    openModal(`
      <h3>🧹 Reset tiến độ test (Giữ nguyên kho từ & ngữ pháp)</h3>
      <p class="muted">Hệ thống sẽ tự động chụp Backup 30 ngày trước khi đưa tiến độ về Phiên 1. Nhập chữ <b>RESET</b> để xác nhận:</p>
      <input id="resetConfirmTxt" placeholder="Gõ RESET" />
      <div class="row" style="margin-top:10px;">
        <button class="danger" onclick="window._confirmResetProfile()">Xác nhận Reset</button>
        <button onclick="window._closeModal()">Hủy</button>
      </div>
    `);
  };
  window._confirmResetProfile = async () => {
    if ((document.getElementById('resetConfirmTxt')?.value || '').trim() !== 'RESET') {
      toast('Chưa gõ đúng chữ RESET.'); return;
    }
    await createAutoBackup('Trước khi Reset tiến độ test');
    const keepSync = STATE.profile.sync_cfg;
    STATE.profile = { ...DEFAULT_PROFILE(), sync_cfg: keepSync };
    STATE.activeSession = null;
    await saveProfile(); await saveActiveSession();
    closeModal(); render(); toast('✅ Đã reset tiến độ về Phiên 1 (đã lưu Backup dự phòng).');
  };

  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      STATE.tab = btn.dataset.tab;
      render();
    });
  });
  document.getElementById('btnTheme').addEventListener('click', async () => {
    STATE.theme = STATE.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', STATE.theme);
    await dbPut('meta', { key: 'theme', value: STATE.theme });
    updateHeader();
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  loadAllState().then(render);
})();
</script>
</body>
</html>
