<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1d4ed8" />
  <title>Master 365 — Lộ Trình 365 Phiên (FINAL V3.4)</title>
  <link rel="manifest" href="./manifest.json" />
  <style>
    :root {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --primary: #1d4ed8;
      --primary-soft: #eff6ff;
      --success: #15803d;
      --success-soft: #f0fdf4;
      --warn: #b45309;
      --warn-soft: #fffbeb;
      --danger: #b91c1c;
      --danger-soft: #fef2f2;
      --radius: 14px;
      --shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }
    [data-theme="dark"] {
      --bg: #0b1220;
      --surface: #111a2e;
      --surface-2: #1b2740;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #2b3a55;
      --primary: #3b82f6;
      --primary-soft: #172554;
      --success: #22c55e;
      --success-soft: #052e16;
      --warn: #f59e0b;
      --warn-soft: #451a03;
      --danger: #ef4444;
      --danger-soft: #450a0a;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      padding-bottom: 88px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .logo {
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 10px;
      flex-shrink: 0;
    }
    .brand-title { font-weight: 800; font-size: 15px; line-height: 1.2; }
    .brand-sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top-pills { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; justify-content: flex-end; }
    .pill {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      white-space: nowrap;
    }
    .pill.ok { background: var(--success-soft); color: var(--success); border-color: var(--success); }
    .pill.warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
    .pill.err { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
    .pill.pri { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }
    main { max-width: 820px; margin: 0 auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .card h2 { margin: 0 0 8px; font-size: 17px; }
    .card h3 { margin: 0 0 6px; font-size: 15px; }
    .muted { color: var(--muted); font-size: 13px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .between { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); gap: 8px; }
    .stat-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
    }
    .stat-num { font-size: 19px; font-weight: 800; color: var(--primary); }
    .stat-lbl { font-size: 11px; color: var(--muted); }
    button {
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      padding: 10px 14px;
      min-height: 44px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    button.success { background: var(--success); color: #fff; border-color: var(--success); }
    button.warn { background: var(--warn); color: #fff; border-color: var(--warn); }
    button.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
    button.sm { min-height: 36px; padding: 6px 10px; font-size: 12px; }
    button:disabled { opacity: .48; cursor: not-allowed; }
    input, select, textarea {
      width: 100%;
      font: inherit;
      font-size: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }
    textarea { min-height: 100px; resize: vertical; }
    .subtabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
    .subtab { flex: 1; min-width: 96px; min-height: 38px; font-size: 13px; border-radius: 10px; }
    .subtab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .nav-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
      gap: 4px;
    }
    .nav-btn {
      min-height: 52px;
      padding: 6px 4px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      flex-direction: column;
      gap: 2px;
      border-radius: 10px;
    }
    .nav-btn.active { background: var(--primary-soft); color: var(--primary); }
    .nav-ico { font-size: 18px; line-height: 1; }
    .item-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: var(--surface-2);
      margin-top: 8px;
    }
    .banner {
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      border: 1px solid var(--border);
      background: var(--primary-soft);
      color: var(--text);
      margin-top: 8px;
    }
    .banner.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
    .banner.ok { background: var(--success-soft); border-color: var(--success); color: var(--success); }
    .banner.err { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
    .opt-btn {
      width: 100%;
      justify-content: flex-start;
      text-align: left;
      margin-top: 8px;
      background: var(--surface);
    }
    .chip-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .word-chip {
      padding: 8px 12px;
      min-height: 38px;
      border-radius: 999px;
      border: 1px solid var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
    }
    .divider { height: 1px; background: var(--border); margin: 12px 0; }
    .hidden { display: none !important; }
    .toast {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      background: var(--text);
      color: var(--surface);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 6px 20px rgba(0,0,0,.22);

      text-align: center;
    }
    .modal-bg {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(15,23,42,.58);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;

    .modal {
      width: 100%;
      max-width: 580px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--surface);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--border);

    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
    }
    label.field-lbl { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin: 8px 0 4px; }
  </style>
</head>

<script id="m365-core">
(() => {
  'use strict';

  /* =========================================================
     1. HẰNG SỐ & BẢN ĐỒ CỐ ĐỊNH 365 PHIÊN (FINAL V3.4)
  ========================================================= */
  const DB_NAME = 'Master365_V34_DB';
  const DB_VERSION = 1;
  const MONTHLY_GATES = new Set([29, 58, 87, 116, 145, 174, 203, 232, 261, 290, 319, 348]);
  const EXT_ROTATION = ['EXT_IDIOM', 'EXT_PROVERB', 'EXT_QUOTE', 'EXT_ABBR'];
  const SPEC_PRIORITY = ['Logistics & Vận tải', 'Luật & Tuân thủ', 'Kinh doanh & Thương mại', 'Ngân hàng & Tài chính'];
  const FLOOR_QUOTAS = { BASIC: 500, SPECIALIZED: 425, IELTS_ADV: 275, EXT_IDIOM: 25, EXT_PROVERB: 25, EXT_QUOTE: 25, EXT_ABBR: 25 };

  // Thư viện 40 dạng hoạt động Từ vựng + 8 dạng INTEGRATED
  const ACTIVITY_40 = {
    Listening: [
      { id: 1, name: 'Nghe chọn từ/nghĩa', engine: 'listen_mcq' },
      { id: 2, name: 'Nghe chọn tình huống', engine: 'listen_ctx' },
      { id: 3, name: 'Nghe điền khuyết', engine: 'listen_fill' },
      { id: 4, name: 'Nghe chính tả', engine: 'listen_dict' },

    ],
    Reading: [
      { id: 11, name: 'Đọc chọn nghĩa ngữ cảnh', engine: 'read_mcq' },
      { id: 12, name: 'Đọc điền khuyết', engine: 'read_cloze' },
      { id: 13, name: 'Đọc Đúng/Sai', engine: 'read_tf' },
      { id: 14, name: 'Đọc tìm thông tin', engine: 'read_mcq' },

      { id: 16, name: 'Đọc sắp xếp câu', engine: 'scramble' },
      { id: 17, name: 'Đọc tìm lỗi dùng từ', engine: 'read_tf' },
      { id: 18, name: 'Đọc suy luận', engine: 'read_cloze' },
      { id: 19, name: 'Đọc đối chiếu', engine: 'read_mcq' },
      { id: 20, name: 'Đọc và xử lý', engine: 'read_cloze' }
    ],
    Speaking: [
      { id: 21, name: 'Đọc từ thành tiếng', engine: 'speak_fb' },
      { id: 22, name: 'Nghe rồi nhắc lại', engine: 'speak_fb' },
      { id: 23, name: 'Shadowing theo câu', engine: 'speak_fb' },
      { id: 24, name: 'Đọc câu ứng dụng', engine: 'speak_fb' },
      { id: 25, name: 'Trả lời câu hỏi ngắn', engine: 'speak_fb' },
      { id: 26, name: 'Mô tả tình huống', engine: 'speak_fb' },
      { id: 27, name: 'Kể lại nội dung', engine: 'speak_fb' },
      { id: 28, name: 'Đóng vai giao tiếp', engine: 'speak_fb' },
      { id: 29, name: 'Giải thích quyết định', engine: 'speak_fb' },
      { id: 30, name: 'Nói tự do có hướng dẫn', engine: 'speak_fb' }
    ],
    Writing: [
      { id: 31, name: 'Viết chính tả', engine: 'write_spell' },
      { id: 32, name: 'Sắp xếp từ thành câu', engine: 'scramble' },
      { id: 33, name: 'Điền từ không gợi ý', engine: 'write_cloze' },
      { id: 34, name: 'Dịch Việt → Anh', engine: 'write_spell' },
      { id: 35, name: 'Viết lại câu', engine: 'write_cloze' },
      { id: 36, name: 'Sửa lỗi từ vựng', engine: 'write_cloze' },
      { id: 37, name: 'Đặt câu với từ mới', engine: 'write_sent' },
      { id: 38, name: 'Viết phản hồi ngắn', engine: 'write_sent' },
      { id: 39, name: 'Viết đoạn/báo cáo ngắn', engine: 'write_sent' },
      { id: 40, name: 'Viết xử lý tình huống', engine: 'write_sent' }
    ],
    Integrated: [
      { id: 41, name: 'Nghe → Điền thông tin', engine: 'listen_fill' },
      { id: 42, name: 'Đọc → Viết phản hồi', engine: 'write_sent' },
      { id: 43, name: 'Nghe → Tóm tắt từ khóa', engine: 'listen_dict' },
      { id: 44, name: 'Đọc đối chiếu → Chọn phương án', engine: 'read_mcq' },
      { id: 45, name: 'Nghe cuộc gọi → Cập nhật', engine: 'listen_fill' },
      { id: 46, name: 'Đọc tình huống → Đặt câu giải pháp', engine: 'write_sent' },
      { id: 47, name: 'Nghe + Đọc → Ghép câu', engine: 'scramble' },
      { id: 48, name: 'Mô phỏng quy trình tổng hợp', engine: 'read_cloze' }
    ]
  };

  // Ngân sách ngữ pháp tuần nhẹ / tuần khó (Luyện & Thi độc lập)
  const GRAMMAR_BUDGET = {
    LIGHT_GRAMMAR: {
      1: { prac: 0, assess: 0, label: 'Hôm nay không có ngữ pháp mới' },
      2: { prac: 10, assess: 10, label: 'Chủ điểm nhẹ #1 — Nhận diện, điền khuyết, sửa lỗi' },
      3: { prac: 12, assess: 10, label: 'Luyện tiếp #1 — Phân biệt, sửa lỗi, biến đổi câu' },
      4: { prac: 10, assess: 10, label: 'Chủ điểm nhẹ #2 — Nhận diện, điền khuyết, sửa lỗi' },
      5: { prac: 12, assess: 10, label: 'Luyện tiếp #2 — Sửa lỗi, viết lại, ứng dụng' },
      6: { prac: 14, assess: 12, label: 'Củng cố #2 & đối chiếu #1 nếu liên quan' }
    },
    HARD_GRAMMAR: {
      1: { prac: 10, assess: 10, label: 'Bậc 1 — Nền tảng đầy đủ, công thức, dấu hiệu, nhận diện' },
      2: { prac: 12, assess: 10, label: 'Bậc 2 — Lỗi phổ biến, phân biệt 2 cách dùng dễ nhầm' },
      3: { prac: 14, assess: 12, label: 'Bậc 3 — Điền khuyết, biến đổi & viết lại câu' },
      4: { prac: 16, assess: 12, label: 'Bậc 4 — Ngoại lệ, bẫy ngược, ngữ cảnh' },
      5: { prac: 18, assess: 12, label: 'Bậc 5 — Ứng dụng, sửa lỗi, lập luận độc lập' },
      6: { prac: 20, assess: 14, label: 'Bậc 6 — Bẫy tổng hợp, cấu trúc nâng cao' }
    }
  };

  const VOCAB_QUOTA_BY_DAY = {
    HARD_GRAMMAR: {
      1: { BASIC: 2, SPECIALIZED: 2, IELTS_ADV: 2 },
      2: { BASIC: 2, SPECIALIZED: 2, IELTS_ADV: 1 },
      3: { BASIC: 2, SPECIALIZED: 2, IELTS_ADV: 0 },
      4: { BASIC: 2, SPECIALIZED: 1, IELTS_ADV: 0 },
      5: { BASIC: 1, SPECIALIZED: 1, IELTS_ADV: 0 },
      6: { BASIC: 1, SPECIALIZED: 1, IELTS_ADV: 0 }
    },
    LIGHT_GRAMMAR: {
      1: { BASIC: 2, SPECIALIZED: 2, IELTS_ADV: 2 },
      2: { BASIC: 1, SPECIALIZED: 2, IELTS_ADV: 0 },
      3: { BASIC: 2, SPECIALIZED: 0, IELTS_ADV: 2 },
      4: { BASIC: 1, SPECIALIZED: 2, IELTS_ADV: 0 },
      5: { BASIC: 2, SPECIALIZED: 2, IELTS_ADV: 2 },
      6: { BASIC: 2, SPECIALIZED: 0, IELTS_ADV: 2 }
    }
  };

  // Bản đồ cố định 365 phiên (không chia session_id cho 7)
  const SESSION_MAP = [];
  (() => {
    let week = 1, day = 1, extIdx = 0;
    for (let sid = 1; sid <= 365; sid++) {
      if (MONTHLY_GATES.has(sid)) {
        const monthNum = Math.round(sid / 29);
        SESSION_MAP.push({ session_id: sid, month_index: monthNum, week_index: null, day_index: null, session_type: 'MONTHLY_GATE', default_week_type: null, ext_group: null, min_q: 50, pass_pct: 80 });
      } else if (sid === 363 || sid === 364) {
        SESSION_MAP.push({ session_id: sid, month_index: 13, week_index: null, day_index: null, session_type: 'FINAL_REVIEW', default_week_type: null, ext_group: null, min_q: 60, pass_pct: 82 });
      } else if (sid === 365) {
        SESSION_MAP.push({ session_id: sid, month_index: 13, week_index: null, day_index: null, session_type: 'GRADUATION', default_week_type: null, ext_group: null, min_q: 80, pass_pct: 85 });
      } else {
        const monthNum = sid <= 348 ? Math.floor((sid - 1) / 29) + 1 : 13;
        const defaultWeekType = (week % 2 === 1) ? 'HARD_GRAMMAR' : 'LIGHT_GRAMMAR';
        const isWeekly = (day === 7);
        let extGroup = null;
        if (day === 3 || day === 6) {
          extGroup = EXT_ROTATION[extIdx % 4];
          extIdx++;
        }
        SESSION_MAP.push({
          session_id: sid,
          month_index: monthNum,
          week_index: week,
          day_index: day,
          session_type: isWeekly ? 'WEEKLY_REVIEW' : 'REGULAR',
          default_week_type: defaultWeekType,
          ext_group: extGroup,
          min_q: isWeekly ? 40 : null,
          pass_pct: isWeekly ? 80 : null
        });
        day++;
        if (day > 7) { day = 1; week++; }
      }
    }
  })();

  /* =========================================================
     2. TIỆN ÍCH THỜI GIAN (03:00 LOGICAL DAY, TUẦN LOGIC) & HASH
  ========================================================= */
  function getLogicalDateObj(now = new Date()) {
    return new Date(now.getTime() - 3 * 3600 * 1000);
  }
  function getLogicalDay(now = new Date()) {
    const d = getLogicalDateObj(now);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function getLogicalWeekKey(now = new Date()) {
    const d = getLogicalDateObj(now);
    const dow = (d.getDay() + 6) % 7; // Mon=0 .. Sun=6
    const mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow);
    return `${mon.getFullYear()}-${String(mon.getMonth() + 1).padStart(2, '0')}-${String(mon.getDate()).padStart(2, '0')}`;
  }
  function addDays(ymd, days) {
    const [y, m, d] = ymd.split('-').map(Number);
    const dt = new Date(y, m - 1, d + days);
    return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
  }
  function simpleHash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return 'h' + (h >>> 0).toString(16);
  }
  function makeImmutableId(prefix) {
    return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
  }
  function ceilScore(total, pct) {
    return Math.ceil((total * pct) / 100);
  }
  function escHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /* =========================================================
     3. INDEXEDDB NGUYÊN TỬ + BỘ NHỚ BỀN VỮNG + BACKUP 30 NGÀY
  ========================================================= */
  let db = null;
  let pcDirHandle = null;

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('vocab')) d.createObjectStore('vocab', { keyPath: 'vocab_id' });
        if (!d.objectStoreNames.contains('grammar')) d.createObjectStore('grammar', { keyPath: 'grammar_id' });
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'key' });
        if (!d.objectStoreNames.contains('backups')) d.createObjectStore('backups', { keyPath: 'backup_id' });
      };
      req.onsuccess = () => { db = req.result; resolve(db); };
      req.onerror = () => reject(req.error);
    });
  }
  function dbGetAll(store) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readonly');
      const req = tx.objectStore(store).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }
  function dbPut(store, obj) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).put(obj);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  function dbDelete(store, key) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  function dbBulkWrite(vocabList, grammarList, replaceAll = false) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(['vocab', 'grammar'], 'readwrite');
      const vs = tx.objectStore('vocab');
      const gs = tx.objectStore('grammar');
      if (replaceAll) { vs.clear(); gs.clear(); }
      (vocabList || []).forEach(v => vs.put(v));
      (grammarList || []).forEach(g => gs.put(g));
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function requestPersistentStorage() {
    try {
      if (navigator.storage && navigator.storage.persist) {
        await navigator.storage.persist();
      }
      if (navigator.storage && navigator.storage.estimate) {
        const est = await navigator.storage.estimate();
        STATE.storageInfo = {
          usedMB: ((est.usage || 0) / (1024 * 1024)).toFixed(2),
          quotaMB: ((est.quota || 0) / (1024 * 1024)).toFixed(0)
        };
      }
    } catch (_) {}
  }

  /* =========================================================
     4. TRẠNG THÁI TOÀN CỤC (STATE)
  ========================================================= */
  const DEFAULT_PROFILE = () => ({
    current_session_id: 1,
    streak: 0,
    last_study_logical_day: null,
    last_seen_ts: Date.now(),
    xp: 0,
    xp_events: {},
    busy_days: {},
    week_choices: {},          // week_index -> 'HARD_GRAMMAR' | 'LIGHT_GRAMMAR'
    allocations: {},           // canonical_identity -> session_id
    ext_allocations: {},       // canonical_identity -> session_id
    snapshots: {},             // session_id -> immutable snapshot
    completed_sessions: {},    // session_id -> { logical_day, study_date, scores }
    srs: {},                   // vocab_id -> { due_day, interval_idx, lapses, reps }
    notes: {},                 // canonical_identity -> string
    sentence_bank: [],         // [{ id, vocab_id, lemma, sentence, date }]
    mistakes: [],              // [{ id, type, ref_id, prompt, wrong, correct, date }]
    skill_stats: {
      Listening: { ok: 0, err: 0 },
      Reading: { ok: 0, err: 0 },
      Speaking: { ok: 0, err: 0 },
      Writing: { ok: 0, err: 0 },
      Grammar: { ok: 0, err: 0 },
      Extension: { ok: 0, err: 0 }
    },
    grammar_mastery: {},       // topic -> { ok, err }
    topic_mix: 'ALL',          // ALL | DAILY | OFFICE | ACADEMIC | LOGISTICS
    evening_reminder: '20:30',
    last_daily_backup_day: null,
    sync_cfg: {
      firebase_url: '',
      room_code: 'M365-CHUNG',
      pin: ''
    }
  });

  const STATE = {
    tab: 'today',
    contentSubTab: 'vocab',    // vocab | grammar | ext
    roadmapFilter: 'MONTH_1',  // MONTH_1..MONTH_12 | FINAL | ALL
    theme: 'light',
    vocab: [],
    grammar: [],
    backups: [],
    profile: DEFAULT_PROFILE(),
    activeSession: null,
    importPreview: null,
    contentFilter: { status: 'ALL', group: 'ALL', q: '' },
    storageInfo: { usedMB: '0', quotaMB: '?' },
    bpmTimer: null,
    speedTimer: null,
    lastSyncSummary: null
  };

  async function reloadContentFromDB() {
    STATE.vocab = await dbGetAll('vocab');
    STATE.grammar = await dbGetAll('grammar');
    STATE.backups = (await dbGetAll('backups')).sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
    return {
      coreVocab: STATE.vocab.filter(v => v.target_pool === 'SESSION_POOL').length,
      extVocab: STATE.vocab.filter(v => v.target_pool === 'EXTENSION_ONLY').length,
      grammar: STATE.grammar.length
    };
  }

  async function loadAllState() {
    await openDB();
    await requestPersistentStorage();
    await reloadContentFromDB();
    const metas = await dbGetAll('meta');
    const p = metas.find(m => m.key === 'profile');
    if (p && p.value) {
      STATE.profile = { ...DEFAULT_PROFILE(), ...p.value, sync_cfg: { ...DEFAULT_PROFILE().sync_cfg, ...(p.value.sync_cfg || {}) } };
    }
    const a = metas.find(m => m.key === 'activeSession');
    if (a && a.value) STATE.activeSession = a.value;
    const t = metas.find(m => m.key === 'theme');
    if (t && t.value) STATE.theme = t.value;
    document.documentElement.setAttribute('data-theme', STATE.theme);

    // Phát hiện lệch đồng hồ hệ thống bất thường (> 6 giờ lùi ngược)
    const nowTs = Date.now();
    if (STATE.profile.last_seen_ts && nowTs < STATE.profile.last_seen_ts - 6 * 3600 * 1000) {
      toast('⚠️ Phát hiện giờ thiết bị lùi bất thường — đã khóa chống nhân đôi Streak/XP.');
    } else {
      STATE.profile.last_seen_ts = nowTs;
      await saveProfile();
    }

    // Tự động backup mỗi ngày logic (lưu tối thiểu 30 ngày)
    const today = getLogicalDay();
    if (STATE.profile.last_daily_backup_day !== today && (STATE.vocab.length || Object.keys(STATE.profile.completed_sessions).length)) {
      await createAutoBackup(`Tự động ngày ${today}`);
      STATE.profile.last_daily_backup_day = today;
      await saveProfile();
    }
  }

  async function saveProfile() {
    await dbPut('meta', { key: 'profile', value: STATE.profile });
  }
  async function saveActiveSession() {
    await dbPut('meta', { key: 'activeSession', value: STATE.activeSession });
  }

  /* =========================================================
     5. BACKUP TỰ ĐỘNG TỐI THIỂU 30 NGÀY + THƯ MỤC PC + JSON
  ========================================================= */
  function buildFullPayload(reason = 'manual') {
    return {
      schema: 'MASTER365_SYNC_V34',
      reason,
      exported_at: new Date().toISOString(),
      logical_day: getLogicalDay(),
      completed_count: Object.keys(STATE.profile.completed_sessions || {}).length,
      current_session_id: STATE.profile.current_session_id,
      counts: {
        core_vocab: STATE.vocab.filter(v => v.target_pool === 'SESSION_POOL').length,
        ext_vocab: STATE.vocab.filter(v => v.target_pool === 'EXTENSION_ONLY').length,
        grammar: STATE.grammar.length
      },
      vocab: STATE.vocab,
      grammar: STATE.grammar,
      profile: STATE.profile
    };
  }

  async function createAutoBackup(reason) {
    const backup = {
      backup_id: makeImmutableId('bkp'),
      created_at: new Date().toISOString(),
      logical_day: getLogicalDay(),
      reason,
      completed_count: Object.keys(STATE.profile.completed_sessions || {}).length,
      counts: {
        core_vocab: STATE.vocab.filter(v => v.target_pool === 'SESSION_POOL').length,
        ext_vocab: STATE.vocab.filter(v => v.target_pool === 'EXTENSION_ONLY').length,
        grammar: STATE.grammar.length
      },
      payload: buildFullPayload(reason)
    };
    await dbPut('backups', backup);

    // Giữ tối thiểu 30 ngày gần nhất và tối thiểu 30 bản gần nhất
    const all = (await dbGetAll('backups')).sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
    const cutoff = Date.now() - 31 * 24 * 3600 * 1000;
    for (let i = 30; i < all.length; i++) {
      if (new Date(all[i].created_at).getTime() < cutoff) {
        await dbDelete('backups', all[i].backup_id);
      }
    }
    STATE.backups = (await dbGetAll('backups')).sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));

    // Nếu PC đã chọn thư mục Backup tự động -> tự ghi file ra ổ cứng
    if (pcDirHandle) {
      await writePcBackupFile(backup.payload);
    }
    return backup;
  }

  async function pickPcBackupFolder() {
    if (!window.showDirectoryPicker) {
      toast('Trình duyệt này chưa hỗ trợ chọn thư mục tự động (dùng Chrome/Edge trên PC, hoặc dùng nút Xuất JSON).');
      return false;
    }
    try {
      pcDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
      await writePcBackupFile(buildFullPayload('pc_folder_init'));
      toast('✅ Đã gắn thư mục Backup tự động trên PC & lưu bản đầu tiên!');
      return true;
    } catch (_) {
      return false;
    }
  }

  async function writePcBackupFile(payload) {
    if (!pcDirHandle) return false;
    try {
      const fname = `master365-backup-${getLogicalDay()}.json`;
      const fh = await pcDirHandle.getFileHandle(fname, { create: true });
      const w = await fh.createWritable();
      await w.write(JSON.stringify(payload, null, 2));
      await w.close();
      return true;
    } catch (_) {
      return false;
    }
  }

  async function applyFullPayload(data, sourceLabel) {
    if (!data || !Array.isArray(data.vocab) || !Array.isArray(data.grammar)) {
      throw new Error('Gói dữ liệu thiếu mảng vocab hoặc grammar hợp lệ.');
    }
    // Chụp bản dự phòng tự động ngay trước khi áp dữ liệu mới
    await createAutoBackup(`Trước khi khôi phục/kéo (${sourceLabel})`);
    await dbBulkWrite(data.vocab, data.grammar, true);
    if (data.profile) {
      const keepSyncCfg = STATE.profile.sync_cfg;
      STATE.profile = { ...DEFAULT_PROFILE(), ...data.profile, sync_cfg: data.profile.sync_cfg?.firebase_url ? data.profile.sync_cfg : keepSyncCfg };
      await saveProfile();
    }
    STATE.activeSession = null;
    await saveActiveSession();
    // Read-After-Write Verification
    const verified = await reloadContentFromDB();
    return verified;
  }

  /* =========================================================
     6. ĐỒNG BỘ 1 MÃ CHUNG CỐ ĐỊNH + PIN (PC ↔ ĐIỆN THOẠI)
  ========================================================= */
  function getCloudEndpoint() {
    const cfg = STATE.profile.sync_cfg || {};
    const base = (cfg.firebase_url || '').trim().replace(/\/+$/, '');
    const room = (cfg.room_code || '').trim().replace(/[^a-zA-Z0-9_-]/g, '');
    const pin = (cfg.pin || '').trim();
    if (!base || !room || !pin) return null;
    const keyHash = simpleHash(`${room}::${pin}`);
    return `${base}/master365_rooms/${room}_${keyHash}.json`;
  }

  async function cloudFetchRemote() {
    const url = getCloudEndpoint();
    if (!url) throw new Error('Chưa nhập đủ Firebase URL, Mã phòng chung và Mã PIN.');
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`Lỗi kết nối Cloud (${res.status}).`);
    return await res.json();
  }

  async function cloudPushAll(forceOverwrite = false) {
    const url = getCloudEndpoint();
    if (!url) throw new Error('Chưa cấu hình đủ Firebase URL + Mã chung + PIN.');
    const localTotal = STATE.vocab.length + STATE.grammar.length;
    const localDone = Object.keys(STATE.profile.completed_sessions || {}).length;

    if (localTotal === 0 && localDone === 0 && !forceOverwrite) {
      return { blocked: true, reason: 'EMPTY_LOCAL', message: 'Máy này đang TRỐNG dữ liệu (0 từ, 0 phiên). Đã chặn Đẩy để tránh xóa trắng dữ liệu trên Cloud!' };
    }
    const remote = await cloudFetchRemote();
    const remoteDone = remote ? (remote.completed_count || 0) : 0;
    const remoteTotal = remote ? ((remote.vocab?.length || 0) + (remote.grammar?.length || 0)) : 0;

    if (!forceOverwrite && remote && (localDone < remoteDone || (localTotal < remoteTotal && localDone === remoteDone))) {
      return {
        blocked: true,
        reason: 'OLDER_LOCAL',
        localDone, remoteDone, localTotal, remoteTotal,
        message: `Cảnh báo Push Guard: Cloud đang có nhiều tiến độ/dữ liệu hơn máy này (Máy này: ${localDone} phiên / ${localTotal} mục — Cloud: ${remoteDone} phiên / ${remoteTotal} mục).`
      };
    }

    const payload = buildFullPayload('cloud_push');
    const res = await fetch(url, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error(`Đẩy lên Cloud thất bại (${res.status}).`);
    return { blocked: false, counts: payload.counts, done: localDone };
  }

  async function cloudPullAll() {
    const remote = await cloudFetchRemote();
    if (!remote || !remote.vocab) throw new Error('Mã phòng này trên Cloud chưa có dữ liệu.');
    const verified = await applyFullPayload(remote, 'Cloud Sync');
    return { verified, done: Object.keys(STATE.profile.completed_sessions || {}).length, exported_at: remote.exported_at };
  }

  /* =========================================================
     7. PARSER CHUẨN # MASTER365_TXT_SCHEMA=2 (ID BẤT BIẾN)
  ========================================================= */
  function splitUnescaped(line, delim) {
    const out = [];
    let cur = '', esc = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (esc) { cur += '\\' + ch; esc = false; continue; }
      if (ch === '\\') { esc = true; continue; }
      if (ch === delim) { out.push(cur); cur = ''; continue; }
      cur += ch;
    }
    if (esc) cur += '\\';
    out.push(cur);
    return out;
  }
  function unescapeField(s) {
    return s.replace(/\\(\||;|,|\\|n)/g, (_, m) => m === 'n' ? '\n' : m).trim();
  }
  function parseSchema2(text) {
    const lines = text.replace(/\r\n/g, '\n').split('\n');
    let hasHeader = false, block = null;
    const vocab = [], grammar = [], errors = [];
    const existingVocabByCanon = new Map(STATE.vocab.map(v => [v.canonical_identity, v]));
    const existingGramByHash = new Map(STATE.grammar.map(g => [g.content_hash, g]));
    const existingGramByPrompt = new Map(STATE.grammar.map(g => [`${g.tier}|${(g.question || '').toLowerCase().slice(0, 60)}`, g]));

    lines.forEach((raw, idx) => {
      const lineNo = idx + 1;
      const line = raw.trim();
      if (!line) return;
      if (line.startsWith('#')) {
        if (line.includes('MASTER365_TXT_SCHEMA=2')) hasHeader = true;
        return;
      }
      if (line === '[VOCAB]') { block = 'VOCAB'; return; }
      if (line === '[GRAMMAR]') { block = 'GRAMMAR'; return; }
      if (!block) { errors.push(`Dòng ${lineNo}: Nằm ngoài khối [VOCAB] hoặc [GRAMMAR].`); return; }

      const cols = splitUnescaped(line, '|').map(unescapeField);
      if (block === 'VOCAB') {
        if (cols.length !== 13) { errors.push(`Dòng ${lineNo}: [VOCAB] cần đúng 13 cột (hiện có ${cols.length}).`); return; }
        const [lemma, pos, ipa, meaning, tier_group, categories, example, example_vi, collocations, variant_notes, target_pool, canonical_sense_key, language] = cols;
        if (!lemma || !pos || !meaning || !tier_group || !target_pool) {
          errors.push(`Dòng ${lineNo}: Thiếu cột bắt buộc (lemma/pos/meaning/tier_group/target_pool).`); return;
        }
        const lang = (language || 'en').toLowerCase();
        const sense = canonical_sense_key || 'default';
        const canon = `${lemma.toLowerCase()}|${lang}|${pos.toLowerCase()}|${sense.toLowerCase()}`;
        const content_hash = simpleHash(cols.join('|'));
        const existing = existingVocabByCanon.get(canon);
        vocab.push({
          vocab_id: existing ? existing.vocab_id : makeImmutableId('voc'),
          version: existing ? (existing.content_hash === content_hash ? existing.version : existing.version + 1) : 1,
          status: existing ? existing.status : 'DRAFT',
          canonical_identity: canon,
          content_hash,
          is_update: !!existing && existing.content_hash !== content_hash,
          is_dup: !!existing && existing.content_hash === content_hash,
          lemma, pos, ipa, meaning, tier_group, categories, example, example_vi, collocations,
          variant_notes: '', // Ẩn/bỏ biến thể theo FINAL V3.4 (vẫn giữ 13 cột hợp lệ)
          target_pool, canonical_sense_key: sense, language: lang
        });
      } else if (block === 'GRAMMAR') {
        if (cols.length !== 7) { errors.push(`Dòng ${lineNo}: [GRAMMAR] cần đúng 7 cột (hiện có ${cols.length}).`); return; }
        const [tierStr, topic, categories, question, optionsRaw, ansIdxStr, explanation] = cols;
        const tier = parseInt(tierStr, 10);
        const options = splitUnescaped(optionsRaw, ';').map(unescapeField).filter(Boolean);
        const answer_index = parseInt(ansIdxStr, 10);
        if (!tier || tier < 1 || tier > 6 || !question || options.length < 2 || isNaN(answer_index) || answer_index < 0 || answer_index >= options.length) {
          errors.push(`Dòng ${lineNo}: [GRAMMAR] sai định dạng (tier 1–6, ≥2 lựa chọn, answer_index hợp lệ).`); return;
        }
        const content_hash = simpleHash(cols.join('|'));
        const exact = existingGramByHash.get(content_hash);
        const near = !exact ? existingGramByPrompt.get(`${tier}|${question.toLowerCase().slice(0, 60)}`) : null;
        grammar.push({
          grammar_id: exact ? exact.grammar_id : (near ? near.grammar_id : makeImmutableId('grm')),
          matched_old_id: near ? near.grammar_id : null,
          conflict_action: 'update_old', // cho chọn ở Import Preview
          version: exact ? exact.version : (near ? near.version + 1 : 1),
          status: exact ? exact.status : (near ? near.status : 'DRAFT'),
          content_hash,
          is_dup: !!exact,
          is_near: !!near,
          tier, topic: topic || `Ngữ pháp Bậc ${tier}`, categories, question, options, answer_index, explanation
        });
      }
    });
    if (!hasHeader) errors.unshift('Thiếu dòng header chuẩn: # MASTER365_TXT_SCHEMA=2');
    return {
      vocab,
      grammar,
      errors,
      summary: {
        core_vocab: vocab.filter(v => v.target_pool === 'SESSION_POOL').length,
        ext_vocab: vocab.filter(v => v.target_pool === 'EXTENSION_ONLY').length,
        grammar: grammar.length,
        near_conflicts: grammar.filter(g => g.is_near).length
      }
    };
  }

  /* =========================================================
     8. TIỆN ÍCH GIAO DIỆN & ÂM THANH (TOAST, MODAL, TTS, BPM)
  ========================================================= */
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.add('hidden'), 3200);
  }
  function openModal(html) {
    document.getElementById('modalBox').innerHTML = html;
    document.getElementById('modalBg').classList.remove('hidden');
  }
  function closeModal() {
    document.getElementById('modalBg').classList.add('hidden');
  }
  document.getElementById('modalBg').addEventListener('click', (e) => {
    if (e.target.id === 'modalBg') closeModal();
  });

  function speakText(text, rate = 1.0) {
    if (!('speechSynthesis' in window)) { toast('Thiết bị chưa hỗ trợ phát âm tự động.'); return; }
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = rate;
      window.speechSynthesis.speak(u);
    } catch (_) {
      toast('Không thể phát âm — hãy kiểm tra âm lượng điện thoại.');
    }
  }
  function toggleBpm(bpm = 75) {
    if (STATE.bpmTimer) {
      clearInterval(STATE.bpmTimer); STATE.bpmTimer = null; toast('Đã tắt nhịp đọc BPM.'); return;
    }
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      STATE.bpmTimer = setInterval(() => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 660; g.gain.value = 0.08;
        o.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(ctx.currentTime + 0.04);
      }, Math.round(60000 / bpm));
      toast(`Đang bật nhịp đọc ${bpm} BPM (bấm lại để tắt).`);
    } catch (_) { toast('Trình duyệt chặn âm thanh nhịp BPM.'); }
  }

  window.M365 = {
    MONTHLY_GATES, EXT_ROTATION, SPEC_PRIORITY, FLOOR_QUOTAS, ACTIVITY_40, GRAMMAR_BUDGET, VOCAB_QUOTA_BY_DAY, SESSION_MAP,
    getLogicalDay, getLogicalWeekKey, addDays, simpleHash, makeImmutableId, ceilScore, escHtml,
    openDB, dbGetAll, dbPut, dbDelete, dbBulkWrite, reloadContentFromDB, loadAllState, saveProfile, saveActiveSession,
    STATE, DEFAULT_PROFILE, createAutoBackup, pickPcBackupFolder, writePcBackupFile, buildFullPayload, applyFullPayload,
    cloudPushAll, cloudPullAll, parseSchema2, toast, openModal, closeModal, speakText, toggleBpm,
    hasPcFolder: () => !!pcDirHandle
  };
})();
</script>
<script id="m365-app">
(() => {
  'use strict';

  const {
    EXT_ROTATION, SPEC_PRIORITY, ACTIVITY_40, GRAMMAR_BUDGET, VOCAB_QUOTA_BY_DAY, SESSION_MAP,
    getLogicalDay, getLogicalWeekKey, addDays, makeImmutableId, ceilScore, escHtml,
    dbGetAll, dbPut, dbDelete, dbBulkWrite, reloadContentFromDB, loadAllState, saveProfile, saveActiveSession,
    STATE, DEFAULT_PROFILE, createAutoBackup, pickPcBackupFolder, buildFullPayload, applyFullPayload,
    cloudPushAll, cloudPullAll, parseSchema2, toast, openModal, closeModal, speakText, toggleBpm, hasPcFolder
  } = window.M365;

  function getEffectiveWeekType(meta) {
    if (!meta || !meta.week_index) return null;
    return STATE.profile.week_choices[meta.week_index] || meta.default_week_type;
  }

  function promptWeekChoiceIfNeeded(sessionId) {
    const meta = SESSION_MAP[sessionId - 1];
    if (!meta) return false;
    if (meta.session_type === 'REGULAR' && meta.day_index === 1 && !STATE.profile.week_choices[meta.week_index] && !STATE.profile.snapshots[sessionId]) {
      const defType = meta.default_week_type;
      openModal(`
        <h3>📅 Chọn chế độ học cho Tuần ${meta.week_index}</h3>
        <p class="muted">Bạn có thể chọn chế độ phù hợp với lịch bận/rảnh của tuần này. Khi đã chốt, cả 7 phiên của Tuần ${meta.week_index} sẽ đi theo chế độ này:</p>
        <div class="item-card">
          <b>🔥 Tuần Ngữ pháp Khó (HARD_GRAMMAR)</b>
          <div class="muted">22 từ mới/tuần (6-5-4-3-2-2) + 1 chủ điểm ngữ pháp chuyên sâu 6 bậc (90 luyện / 70 thi).</div>
          <button class="primary" style="width:100%;margin-top:8px;" onclick="window._chooseWeekType(${meta.week_index}, 'HARD_GRAMMAR', ${sessionId})">
            Chọn Tuần Khó ${defType === 'HARD_GRAMMAR' ? '(Gợi ý mặc định)' : ''}
          </button>
        </div>
        <div class="item-card">
          <b>🌿 Tuần Ngữ pháp Nhẹ (LIGHT_GRAMMAR)</b>
          <div class="muted">26 từ mới/tuần (6-3-4-3-6-4) + 2 chủ điểm ngữ pháp nhẹ (P1 không có ngữ pháp, 58 luyện / 52 thi).</div>
          <button class="success" style="width:100%;margin-top:8px;" onclick="window._chooseWeekType(${meta.week_index}, 'LIGHT_GRAMMAR', ${sessionId})">
            Chọn Tuần Nhẹ ${defType === 'LIGHT_GRAMMAR' ? '(Gợi ý mặc định)' : ''}
          </button>
        </div>
        <button style="width:100%;margin-top:10px;" onclick="window._closeModal()">Để sau</button>
      `);
      return true;
    }
    return false;
  }

  function createOrLoadSnapshot(sessionId) {
    if (STATE.profile.snapshots[sessionId]) return { ok: true, snapshot: STATE.profile.snapshots[sessionId] };
    const meta = SESSION_MAP[sessionId - 1];
    if (!meta) return { ok: false, error: 'Phiên không tồn tại trong bản đồ 365 phiên.' };

    const pubVocab = STATE.vocab.filter(v => v.status === 'PUBLISHED');
    const pubGram = STATE.grammar.filter(g => g.status === 'PUBLISHED');

    if (meta.session_type === 'REGULAR') {
      const weekType = getEffectiveWeekType(meta);
      const quota = VOCAB_QUOTA_BY_DAY[weekType][meta.day_index];
      const chosenVocab = [];
      const missing = [];

      for (const tier of ['BASIC', 'SPECIALIZED', 'IELTS_ADV']) {
        const need = quota[tier] || 0;
        if (!need) continue;
        let pool = pubVocab.filter(v => v.target_pool === 'SESSION_POOL' && v.tier_group === tier && !STATE.profile.allocations[v.canonical_identity]);
        if (tier === 'SPECIALIZED') {
          pool.sort((a, b) => {
            const ia = SPEC_PRIORITY.findIndex(p => (a.categories || '').toLowerCase().includes(p.toLowerCase()));
            const ib = SPEC_PRIORITY.findIndex(p => (b.categories || '').toLowerCase().includes(p.toLowerCase()));
            return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
          });
        }
        if (pool.length < need) missing.push(`Từ vựng [${tier}]: cần ${need}, mới có ${pool.length} từ PUBLISHED chưa cấp phát.`);
        else chosenVocab.push(...pool.slice(0, need));
      }

      let chosenExt = null;
      if (meta.ext_group) {
        const extPool = pubVocab.filter(v => v.target_pool === 'EXTENSION_ONLY' && v.tier_group === meta.ext_group && !STATE.profile.ext_allocations[v.canonical_identity]);
        if (extPool.length < 1) missing.push(`Mở rộng [${meta.ext_group}]: cần 1 mục PUBLISHED chưa cấp phát (hiện có 0).`);
        else chosenExt = extPool[0];
      }

      const gBudget = GRAMMAR_BUDGET[weekType][meta.day_index];
      let chosenGramPrac = [], chosenGramAssess = [], chosenGramRetake = [];
      if (gBudget.prac > 0) {
        const exactTier = pubGram.filter(g => g.tier === meta.day_index);
        const otherTier = pubGram.filter(g => g.tier !== meta.day_index);
        const orderedG = [...exactTier, ...otherTier];
        const totalNeed = gBudget.prac + gBudget.assess;
        if (orderedG.length < totalNeed) {
          missing.push(`Ngữ pháp [GRAMMAR]: cần tối thiểu ${totalNeed} câu PUBLISHED độc lập (${gBudget.prac} luyện + ${gBudget.assess} thi), hiện mới có ${orderedG.length}.`);
        } else {
          chosenGramPrac = orderedG.slice(0, gBudget.prac).map(g => g.grammar_id);
          chosenGramAssess = orderedG.slice(gBudget.prac, totalNeed).map(g => g.grammar_id);
          const spare = orderedG.slice(totalNeed).map(g => g.grammar_id);
          const maxOverlap = Math.floor(gBudget.assess * 0.3);
          const retakeList = [...spare.slice(0, gBudget.assess)];
          if (retakeList.length < gBudget.assess) {
            const needFill = gBudget.assess - retakeList.length;
            retakeList.push(...chosenGramAssess.slice(0, Math.min(maxOverlap, needFill)));
            if (retakeList.length < gBudget.assess) {
              retakeList.push(...chosenGramPrac.slice(0, gBudget.assess - retakeList.length));
            }
          }
          chosenGramRetake = retakeList.slice(0, gBudget.assess);
        }
      }

      if (missing.length > 0) {
        return { ok: false, error: `BLOCKED_CONTENT (Fail-fast — Thiếu nguồn PUBLISHED):\n• ${missing.join('\n• ')}` };
      }

      chosenVocab.forEach(v => { STATE.profile.allocations[v.canonical_identity] = sessionId; });
      if (chosenExt) STATE.profile.ext_allocations[chosenExt.canonical_identity] = sessionId;

      const estMins = chosenVocab.length * 4 + Math.ceil((chosenGramPrac.length + chosenGramAssess.length) * 0.85) + (chosenExt ? 2 : 0);
      const snapshot = {
        session_id: sessionId,
        meta: { ...meta, week_type: weekType },
        vocab_ids: chosenVocab.map(v => v.vocab_id),
        ext_id: chosenExt ? chosenExt.vocab_id : null,
        grammar_prac_ids: chosenGramPrac,
        grammar_assess_ids: chosenGramAssess,
        grammar_retake_ids: chosenGramRetake,
        workload_mins: estMins,
        workload_warn: estMins > 40,
        created_at: new Date().toISOString()
      };
      STATE.profile.snapshots[sessionId] = snapshot;
      saveProfile();
      return { ok: true, snapshot };
    } else {
      const learnedVocab = STATE.vocab.filter(v => v.status === 'PUBLISHED' && STATE.profile.allocations[v.canonical_identity]);
      const scopeVocab = learnedVocab.length ? learnedVocab : pubVocab.filter(v => v.target_pool === 'SESSION_POOL');
      const missing = [];
      if (scopeVocab.length < 6) missing.push(`Cần tối thiểu 6 từ vựng đã học/PUBLISHED để dựng đề tổng kết (hiện có ${scopeVocab.length}).`);
      if (pubGram.length < 12) missing.push(`Cần tối thiểu 12 câu ngữ pháp PUBLISHED để dựng ma trận đề tổng kết (hiện có ${pubGram.length}).`);
      if (missing.length) return { ok: false, error: `BLOCKED_CONTENT:\n• ${missing.join('\n• ')}` };

      const snapshot = {
        session_id: sessionId,
        meta,
        is_exam: true,
        vocab_ids: scopeVocab.slice(-30).map(v => v.vocab_id),
        grammar_assess_ids: pubGram.slice(0, Math.min(pubGram.length, 24)).map(g => g.grammar_id),
        workload_mins: meta.session_type === 'GRADUATION' ? 50 : 35,
        workload_warn: meta.session_type === 'GRADUATION',
        created_at: new Date().toISOString()
      };
      STATE.profile.snapshots[sessionId] = snapshot;
      saveProfile();
      return { ok: true, snapshot };
    }
  }

  function startOrResumeSession(sessionId, isPracticeReview = false) {
    if (STATE.activeSession && STATE.activeSession.session_id === sessionId) {
      STATE.tab = 'today'; render(); return;
    }
    if (!isPracticeReview && promptWeekChoiceIfNeeded(sessionId)) return;

    const res = createOrLoadSnapshot(sessionId);
    if (!res.ok) {
      openModal(`
        <h3>⚠️ Không thể mở Phiên ${sessionId}</h3>
        <pre style="white-space:pre-wrap;font-size:13px;color:var(--danger);background:var(--danger-soft);padding:10px;border-radius:10px;">${escHtml(res.error)}</pre>
        <p class="muted">Hãy vào tab <b>Kho & Nhập</b> để nạp thêm tệp <code>.txt</code> hoặc bấm duyệt các mục <b>DRAFT → PUBLISHED</b>.</p>
        <button class="primary" style="width:100%;" onclick="window._closeModal()">Đã hiểu</button>
      `);
      return;
    }
    const snap = res.snapshot;
    const alreadyDone = !!STATE.profile.completed_sessions[sessionId];

    if (snap.is_exam) {
      STATE.activeSession = {
        session_id: sessionId,
        is_exam: true,
        is_retake_mode: alreadyDone,
        view: 'overview',
        tracks: { exam: alreadyDone ? 'COMPLETED' : 'NOT_STARTED' },
        quiz: null,
        attempts: { exam: [] }
      };
    } else {
      const hasGram = (snap.grammar_prac_ids && snap.grammar_prac_ids.length > 0);
      const hasExt = !!snap.ext_id;
      STATE.activeSession = {
        session_id: sessionId,
        is_exam: false,
        is_retake_mode: alreadyDone,
        view: 'overview',
        tracks: {
          vocab: alreadyDone ? 'COMPLETED' : 'NOT_STARTED',
          grammar: hasGram ? (alreadyDone ? 'COMPLETED' : 'NOT_STARTED') : 'NOT_APPLICABLE',
          ext: hasExt ? (alreadyDone ? 'COMPLETED' : 'NOT_STARTED') : 'NOT_APPLICABLE'
        },
        v_stage0_done: alreadyDone,
        g_stage0_done: alreadyDone,
        audio_rate: 1.0,
        quiz: null,
        attempts: { vocab: [], grammar: [] },
        speed: null
      };
    }
    STATE.tab = 'today';
    saveActiveSession();
    render();
  }

  async function checkSessionCompletion() {
    const a = STATE.activeSession;
    if (!a) return;
    const reqDone = a.is_exam
      ? (a.tracks.exam === 'COMPLETED')
      : ['vocab', 'grammar', 'ext'].every(k => a.tracks[k] === 'COMPLETED' || a.tracks[k] === 'NOT_APPLICABLE');

    if (reqDone && !STATE.profile.completed_sessions[a.session_id]) {
      const today = getLogicalDay();
      const studyDate = new Date().toISOString().slice(0, 10);
      STATE.profile.completed_sessions[a.session_id] = {
        logical_day: today,
        study_date: studyDate,
        completed_at: new Date().toISOString()
      };

      if (STATE.profile.busy_days[today] && !STATE.profile.busy_days[today].refunded) {
        STATE.profile.busy_days[today].refunded = true;
      }
      if (STATE.profile.last_study_logical_day !== today) {
        STATE.profile.streak += 1;
        STATE.profile.last_study_logical_day = today;
      }
      awardXp(`session_complete_${a.session_id}`, a.is_exam ? 200 : 100);

      const snap = STATE.profile.snapshots[a.session_id];
      if (!a.is_exam && snap && snap.vocab_ids) {
        snap.vocab_ids.forEach(vid => {
          if (!STATE.profile.srs[vid]) {
            STATE.profile.srs[vid] = { due_day: addDays(today, 1), interval_idx: 0, lapses: 0, reps: 0 };
          }
        });
      }
      if (STATE.profile.current_session_id === a.session_id && a.session_id < 365) {
        STATE.profile.current_session_id += 1;
      }
      await saveProfile();
      await createAutoBackup(`Hoàn thành Phiên ${a.session_id}`);
      toast(`🎉 Hoàn thành Phiên ${a.session_id}! Đã mở khóa phiên tiếp theo & tự động sao lưu.`);
    }
  }

  function awardXp(eventId, amount) {
    if (STATE.profile.xp_events[eventId]) return false;
    STATE.profile.xp_events[eventId] = true;
    STATE.profile.xp += amount;
    saveProfile();
    return true;
  }

  /* =========================================================
     BỘ SINH BÀI TẬP 40 HOẠT ĐỘNG + 8 INTEGRATED (9 KIỂU TƯƠNG TÁC)
  ========================================================= */
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function normalizeAns(s) {
    return String(s || '').trim().toLowerCase().replace(/[.,!?;:"']+$/g, '').replace(/\s+/g, ' ');
  }

  function buildQuestionFromActivity(v, act, allPub, idxSeed) {
    const poolMain = allPub.filter(x => x.target_pool === 'SESSION_POOL');
    const others = shuffle(poolMain.filter(x => x.vocab_id !== v.vocab_id));
    const d3 = others.slice(0, 3);
    const ex = (v.example && v.example.length > 8) ? v.example : `In daily work, we often apply ${v.lemma} clearly.`;
    const masked = ex.replace(new RegExp(v.lemma.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'), '_____');

    // 1. Nghe phân biệt từ gần chữ / gần âm (#5)
    if (act.engine === 'listen_pair') {
      const similar = poolMain
        .filter(x => x.vocab_id !== v.vocab_id && x.lemma.length >= 2)
        .sort((a, b) => {
          const sa = (a.lemma[0].toLowerCase() === v.lemma[0].toLowerCase() ? 2 : 0) + Math.abs(a.lemma.length - v.lemma.length);
          const sb = (b.lemma[0].toLowerCase() === v.lemma[0].toLowerCase() ? 2 : 0) + Math.abs(b.lemma.length - v.lemma.length);
          return sb - sa;
        })
        .slice(0, 3);
      const distractors = similar.length >= 3 ? similar : d3;
      return {
        id: `act_${act.id}_${v.vocab_id}_${idxSeed}`, vocab_id: v.vocab_id, skill: 'Listening', primary_domain: 'listening',
        activity_label: `#${act.id} ${act.name}`, engine: 'mcq', speakText: v.lemma,
        prompt: `Nghe kỹ phát âm và chọn đúng từ tiếng Anh (Nghĩa: ${v.meaning}):`,
        options: shuffle([v.lemma, ...distractors.map(x => x.lemma)]),
        answer: v.lemma
      };
    }

    // 2. Nối cặp Từ ↔ Nghĩa (#15 Đọc nối tiêu đề/nghĩa, #19 Đọc đối chiếu)
    if (act.id === 15 || act.id === 19) {
      const pairItems = shuffle([v, ...others.slice(0, 3)]);
      return {
        id: `act_${act.id}_${v.vocab_id}_${idxSeed}`, vocab_id: v.vocab_id, skill: 'Reading', primary_domain: 'reading',
        activity_label: `#${act.id} ${act.name}`, engine: 'match',
        prompt: `Nối đúng từng từ tiếng Anh với nghĩa tiếng Việt tương ứng:`,
        pairs: pairItems.map((it, idx) => ({ left: it.lemma, right: it.meaning, key: idx })),
        rightOptions: shuffle(pairItems.map((it, idx) => ({ text: it.meaning, key: idx }))),
        answer: 'MATCH_ALL'
      };
    }

    // 3. Bắt lỗi sai trong câu (#17 Đọc tìm lỗi dùng từ, #36 Sửa lỗi từ vựng)
    if (act.id === 17 || act.id === 36) {
      const wrongWord = d3[0]?.lemma || 'delay';
      const wrongSentence = `In today's report, the team used "${wrongWord}" instead of "${v.lemma}" (${v.meaning}).`;
      const spots = shuffle([
        { label: `Cụm sai: "${wrongWord}" (lẽ ra là "${v.lemma}")`, isErr: true },
        { label: `Mốc thời gian: "In today's report"`, isErr: false },
        { label: `Chủ ngữ: "the team"`, isErr: false },
        { label: `Cấu trúc: "instead of"`, isErr: false }
      ]);
      return {
        id: `act_${act.id}_${v.vocab_id}_${idxSeed}`, vocab_id: v.vocab_id,
        skill: act.id === 17 ? 'Reading' : 'Writing', primary_domain: act.id === 17 ? 'reading' : 'writing',
        activity_label: `#${act.id} ${act.name}`, engine: 'mcq',
        prompt: `Tìm phần lỗi dùng từ trong câu sau (từ đúng cần dùng là "${v.lemma}" = ${v.meaning}):\n"${wrongSentence}"`,
        options: spots.map(s => s.label),
        answer: spots.find(s => s.isErr).label
      };
    }

    if (act.engine === 'listen_mcq' || act.engine === 'listen_ctx') {
      const opts = shuffle([v.meaning, ...d3.map(x => x.meaning)]);
      return {
        id: `act_${act.id}_${v.vocab_id}_${idxSeed}`, vocab_id: v.vocab_id, skill: 'Listening', primary_domain: 'listening',
        activity_label: `#${act.id} ${act.name}`, engine: 'mcq', speakText: act.engine === 'listen_ctx' ? ex : v.lemma,
        prompt: act.engine === 'listen_ctx' ? `Nghe câu ngữ cảnh và chọn nghĩa đúng của từ trọng tâm:` : `Nghe phát âm và chọn nghĩa tiếng Việt đúng:`,
        options: opts, answer: v.meaning
      };
    }
    if (act.engine === 'listen_fill' || act.engine === 'listen_dict') {
      return {
        id: `act_${act.id}_${v.vocab_id}_${idxSeed}`, vocab_id: v.vocab_id, skill: 'Listening', primary_domain: 'listening',
        activity_label: `#${act.id} ${act.name}`, engine: 'text', speakText: act.engine === 'listen_fill' ? ex : v.lemma,
        prompt: act.engine === 'listen_fill' ? `Nghe câu và điền từ còn thiếu (Nghĩa: ${v.meaning}):\n"${masked}"` : `Nghe và viết chính tả từ tiếng Anh (Nghĩa: ${v.meaning}):`,
        answer: v.lemma
      };
    }
    if (act.engine === 'read_mcq' || act.engine === 'read_cloze') {
      const isCloze = act.engine === 'read_cloze';
      const opts = isCloze ? shuffle([v.lemma, ...d3.map(x => x.lemma)]) : shuffle([v.meaning, ...d3.map(x => x.meaning)]);
      return {
        id: `act_${act.id}_${v.vocab_id}_${idxSeed}`, vocab_id: v.vocab_id, skill: 'Reading', primary_domain: 'reading',
        activity_label: `#${act.id} ${act.name}`, engine: 'mcq',
        prompt: isCloze ? `Chọn từ tiếng Anh phù hợp để điền vào ngữ cảnh:\n"${masked}"\n(Gợi ý nghĩa: ${v.meaning})` : `Đọc ví dụ sau và chọn nghĩa sát nhất của "${v.lemma}":\n"${ex}"`,
        options: opts, answer: isCloze ? v.lemma : v.meaning
      };
    }
    if (act.engine === 'read_tf') {
      const makeTrue = (idxSeed % 2 === 0) || !d3.length;
      const shownMeaning = makeTrue ? v.meaning : d3[0].meaning;
      return {
        id: `act_${act.id}_${v.vocab_id}_${idxSeed}`, vocab_id: v.vocab_id, skill: 'Reading', primary_domain: 'reading',
        activity_label: `#${act.id} ${act.name}`, engine: 'mcq',
        prompt: `Nhận định sau ĐÚNG hay SAI?\nTrong câu "${ex}", từ "${v.lemma}" có nghĩa là "${shownMeaning}".`,
        options: ['ĐÚNG (True)', 'SAI (False)'],
        answer: makeTrue ? 'ĐÚNG (True)' : 'SAI (False)'
      };
    }
    if (act.engine === 'scramble') {
      const tokens = ex.split(/\s+/).filter(Boolean);
      if (tokens.length >= 4 && tokens.length <= 14) {
        return {
          id: `act_${act.id}_${v.vocab_id}_${idxSeed}`, vocab_id: v.vocab_id, skill: 'Writing', primary_domain: 'writing',
          activity_label: `#${act.id} ${act.name}`, engine: 'scramble', speakText: ex,
          prompt: `Sắp xếp các từ sau thành câu hoàn chỉnh có chứa "${v.lemma}" (${v.meaning}):`,
          tokens: shuffle(tokens), answer: tokens.join(' ')
        };
      }
      return {
        id: `act_${act.id}_${v.vocab_id}_${idxSeed}`, vocab_id: v.vocab_id, skill: 'Writing', primary_domain: 'writing',
        activity_label: `#${act.id} ${act.name}`, engine: 'text',
        prompt: `Điền từ tiếng Anh phù hợp (Nghĩa: ${v.meaning}):\n"${masked}"`,
        answer: v.lemma
      };
    }
    if (act.engine === 'speak_fb') {
      return {
        id: `act_${act.id}_${v.vocab_id}_${idxSeed}`, vocab_id: v.vocab_id, skill: 'Speaking', primary_domain: 'speaking',
        activity_label: `#${act.id} ${act.name}`, engine: 'speak', speakText: ex,
        targetWord: v.lemma,
        prompt: `Nghe mẫu rồi đọc to từ "${v.lemma}" (${v.ipa || '...'}) và câu ứng dụng:\n"${ex}"`,
        answer: v.lemma
      };
    }
    if (act.engine === 'write_sent') {
      return {
        id: `act_${act.id}_${v.vocab_id}_${idxSeed}`, vocab_id: v.vocab_id, skill: 'Writing', primary_domain: 'writing',
        activity_label: `#${act.id} ${act.name}`, engine: 'sentence', targetWord: v.lemma,
        prompt: `Đặt một câu tiếng Anh hoàn chỉnh (≥ 4 từ) có sử dụng từ "${v.lemma}" (${v.meaning}). Câu hay sẽ tự lưu vào My Sentence Bank:`,
        answer: v.lemma
      };
    }
    return {
      id: `act_${act.id}_${v.vocab_id}_${idxSeed}`, vocab_id: v.vocab_id, skill: 'Writing', primary_domain: 'writing',
      activity_label: `#${act.id} ${act.name}`, engine: 'text',
      prompt: `Viết đúng từ tiếng Anh có nghĩa "${v.meaning}" vào chỗ trống:\n"${masked}"`,
      answer: v.lemma
    };
  }

  function buildVocabPractice(vocabIds, sessionId, specificAct = null) {
    const items = vocabIds.map(id => STATE.vocab.find(v => v.vocab_id === id)).filter(Boolean);
    const allPub = STATE.vocab.filter(v => v.status === 'PUBLISHED');
    const qs = [];

    if (specificAct) {
      items.forEach((v, idx) => {
        qs.push(buildQuestionFromActivity(v, specificAct, allPub, sessionId * 13 + idx));
      });
      return qs;
    }

    items.forEach((v, idx) => {
      const seed = sessionId * 7 + idx;
      const lAct = ACTIVITY_40.Listening[seed % ACTIVITY_40.Listening.length];
      const rAct = ACTIVITY_40.Reading[(seed + 3) % ACTIVITY_40.Reading.length];
      const sAct = ACTIVITY_40.Speaking[(seed + 5) % ACTIVITY_40.Speaking.length];
      const wAct = ACTIVITY_40.Writing[(seed + 2) % ACTIVITY_40.Writing.length];
      qs.push(buildQuestionFromActivity(v, lAct, allPub, seed));
      qs.push(buildQuestionFromActivity(v, rAct, allPub, seed + 1));
      qs.push(buildQuestionFromActivity(v, wAct, allPub, seed + 2));
      if (idx % 2 === 0) qs.push(buildQuestionFromActivity(v, sAct, allPub, seed + 3));
      if (idx === items.length - 1) {
        const iAct = ACTIVITY_40.Integrated[sessionId % ACTIVITY_40.Integrated.length];
        qs.push(buildQuestionFromActivity(v, iAct, allPub, seed + 4));
      }
    });
    return qs;
  }

  function buildVocabAssessment(vocabIds, attemptNum) {
    const items = vocabIds.map(id => STATE.vocab.find(v => v.vocab_id === id)).filter(Boolean);
    const allPub = STATE.vocab.filter(v => v.status === 'PUBLISHED');
    const qs = [];
    items.forEach((v, idx) => {
      const q1Act = (attemptNum % 2 === 0)
        ? ACTIVITY_40.Listening[(idx + attemptNum) % 2]
        : ACTIVITY_40.Reading[(idx + attemptNum) % 2];
      const q2Act = (attemptNum % 2 === 0)
        ? ACTIVITY_40.Writing[2]
        : ACTIVITY_40.Listening[2];
      const q1 = buildQuestionFromActivity(v, q1Act, allPub, attemptNum * 31 + idx);
      const q2 = buildQuestionFromActivity(v, q2Act, allPub, attemptNum * 47 + idx + 9);
      q1.primary_domain = 'vocab';
      q2.primary_domain = 'vocab';
      qs.push(q1, q2);
    });
    return shuffle(qs);
  }

  function buildGrammarExercises(grammarIds, isAssess) {
    const list = grammarIds.map(id => STATE.grammar.find(g => g.grammar_id === id)).filter(Boolean);
    return (isAssess ? shuffle(list) : list).map(g => ({
      id: g.grammar_id, grammar_id: g.grammar_id, skill: 'Grammar', primary_domain: 'grammar',
      topic: g.topic,
      activity_label: `Ngữ pháp Bậc ${g.tier} • ${g.topic}`,
      engine: 'mcq',
      prompt: g.question,
      options: g.options,
      answer: g.options[g.answer_index],
      explanation: g.explanation
    }));
  }

  function buildExtensionQuiz(sourceMode) {
    const allPubExt = STATE.vocab.filter(v => v.status === 'PUBLISHED' && v.target_pool === 'EXTENSION_ONLY');
    const pool = sourceMode === 'learned'
      ? allPubExt.filter(v => STATE.profile.ext_allocations[v.canonical_identity])
      : allPubExt;
    if (!pool.length) return [];
    const picked = shuffle(pool).slice(0, 5);
    return picked.map((e, i) => {
      const others = shuffle(allPubExt.filter(x => x.vocab_id !== e.vocab_id)).slice(0, 3);
      const ex = e.example || `In practice, people often say "${e.lemma}".`;
      const masked = ex.replace(new RegExp(e.lemma.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'), '_____');
      const mode = i % 3;
      if (mode === 0) {
        return {
          id: `ext_q0_${e.vocab_id}`, vocab_id: e.vocab_id, skill: 'Extension', primary_domain: 'ext',
          activity_label: `Mở rộng (${e.tier_group}) • Nhận diện nghĩa`, engine: 'mcq', speakText: e.lemma,
          prompt: `Cụm "${e.lemma}" thuộc nhóm ${e.tier_group} có nghĩa là gì?`,
          options: shuffle([e.meaning, ...others.map(x => x.meaning)]),
          answer: e.meaning
        };
      }
      if (mode === 1 && others.length >= 1) {
        return {
          id: `ext_q1_${e.vocab_id}`, vocab_id: e.vocab_id, skill: 'Extension', primary_domain: 'ext',
          activity_label: `Mở rộng (${e.tier_group}) • Điền vào ngữ cảnh`, engine: 'mcq',
          prompt: `Chọn cụm mở rộng đúng điền vào câu:\n"${masked}"\n(Nghĩa: ${e.meaning})`,
          options: shuffle([e.lemma, ...others.map(x => x.lemma)]),
          answer: e.lemma
        };
      }
      const hint = e.lemma.slice(0, Math.min(3, e.lemma.length)) + '...';
      return {
        id: `ext_q2_${e.vocab_id}`, vocab_id: e.vocab_id, skill: 'Extension', primary_domain: 'ext',
        activity_label: `Mở rộng (${e.tier_group}) • Gõ cụm / viết tắt`, engine: 'text',
        prompt: `Gõ đúng cụm ${e.tier_group} có nghĩa: "${e.meaning}"\n(Gợi ý mở đầu: ${hint})`,
        answer: e.lemma
      };
    });
  }

  function buildExamQuestions(snap) {
    const meta = snap.meta;
    const totalTarget = meta.min_q || 40;
    const allPub = STATE.vocab.filter(v => v.status === 'PUBLISHED');
    const vocabPool = snap.vocab_ids.map(id => STATE.vocab.find(v => v.vocab_id === id)).filter(Boolean);
    const gramPool = snap.grammar_assess_ids.map(id => STATE.grammar.find(g => g.grammar_id === id)).filter(Boolean);

    const nVoc = Math.round(totalTarget * 0.30);
    const nGram = Math.round(totalTarget * 0.30);
    const nLis = Math.round(totalTarget * 0.15);
    const nRea = Math.round(totalTarget * 0.15);
    const nWri = Math.max(1, totalTarget - nVoc - nGram - nLis - nRea);

    const qs = [];
    for (let i = 0; i < nVoc; i++) {
      const v = vocabPool[i % vocabPool.length];
      const q = buildQuestionFromActivity(v, ACTIVITY_40.Reading[0], allPub, i + 100);
      q.primary_domain = 'vocab'; q.activity_label = 'Tổng hợp • Từ vựng';
      qs.push(q);
    }
    for (let i = 0; i < nGram; i++) {
      const g = gramPool[i % gramPool.length];
      qs.push({
        id: `ex_g_${i}_${g.grammar_id}`, grammar_id: g.grammar_id, skill: 'Grammar', primary_domain: 'grammar',
        topic: g.topic, activity_label: `Tổng hợp • Ngữ pháp (${g.topic})`, engine: 'mcq',
        prompt: g.question, options: g.options, answer: g.options[g.answer_index], explanation: g.explanation
      });
    }
    for (let i = 0; i < nLis; i++) {
      const v = vocabPool[(i + 2) % vocabPool.length];
      const q = buildQuestionFromActivity(v, ACTIVITY_40.Listening[0], allPub, i + 200);
      q.primary_domain = 'listening'; q.activity_label = 'Tổng hợp • Listening';
      qs.push(q);
    }
    for (let i = 0; i < nRea; i++) {
      const v = vocabPool[(i + 4) % vocabPool.length];
      const q = buildQuestionFromActivity(v, ACTIVITY_40.Reading[1], allPub, i + 300);
      q.primary_domain = 'reading'; q.activity_label = 'Tổng hợp • Reading';
      qs.push(q);
    }
    for (let i = 0; i < nWri; i++) {
      const v = vocabPool[(i + 6) % vocabPool.length];
      const q = buildQuestionFromActivity(v, ACTIVITY_40.Writing[2], allPub, i + 400);
      q.primary_domain = 'writing'; q.activity_label = 'Tổng hợp • Writing';
      qs.push(q);
    }
    return shuffle(qs);
  }
